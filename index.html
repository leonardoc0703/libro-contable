      <div class="table-scroll"><table class="ledger" id="concTable"></table></div>
    </div>
    <div class="card">
      <h3>Movimientos según libros (cuenta ${escapeAttr(conciliacionCuenta)})</h3>
      <div class="table-scroll"><table class="ledger" id="concLibrosTable"></table></div>
    </div>
  `;
  if(!cuentasBanco.length){
    document.getElementById('concResumen').innerHTML = '<p class="empty-note">No tienes ninguna cuenta de disponible (clase 11) en el PUC.</p>';
    return;
  }
  document.getElementById('concCuenta').addEventListener('change', (e) => { conciliacionCuenta = e.target.value; renderConciliacionBody(); });
  document.getElementById('btnAddMovBanco').addEventListener('click', () => {
    state.conciliacion.push({ id: uid(), cuenta: conciliacionCuenta, fecha: todayISO(), descripcion: '', valor: 0 });
    scheduleSave();
    renderConciliacionBody();
  });
  guardButton('btnAddMovBanco', 'respaldo');
  renderConciliacionBody();
}
SECTION_RENDERERS.conciliacion = renderConciliacion;

function renderConciliacionBody(){
  const table = document.getElementById('concTable');
  const librosTable = document.getElementById('concLibrosTable');
  const resumen = document.getElementById('concResumen');
  if(!table) return;

  const editable = canEdit('respaldo');
  const movs = state.conciliacion.filter(m => m.cuenta === conciliacionCuenta).sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
  const saldoBanco = movs.reduce((s,m) => s + (Number(m.valor)||0), 0);

  const librosLineas = state.asientos.filter(a => a.cuenta === conciliacionCuenta).sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
  const saldoLibros = librosLineas.reduce((s,a) => s + ((Number(a.debito)||0) - (Number(a.credito)||0)), 0);

  const diferencia = saldoBanco - saldoLibros;
  resumen.innerHTML = `
    <div class="diff-banner ${Math.abs(diferencia) < 1 ? 'ok' : 'bad'}">
      Saldo según banco: ${fmtMoney(saldoBanco)} · Saldo según libros: ${fmtMoney(saldoLibros)} ·
      ${Math.abs(diferencia) < 1 ? '✓ Concilian' : `✗ Diferencia de ${fmtMoney(diferencia)}`}
    </div>
  `;

  table.innerHTML = `
    <thead><tr><th>Fecha</th><th>Descripción</th><th class="num">Valor</th><th></th></tr></thead>
    <tbody>
      ${movs.length ? movs.map(m => `
        <tr data-id="${m.id}">
          <td>${editable ? `<input type="date" data-field="fecha" value="${escapeAttr(m.fecha)}">` : fmtDate(m.fecha)}</td>
          <td>${editable ? `<input data-field="descripcion" value="${escapeAttr(m.descripcion)}" style="min-width:200px;">` : escapeAttr(m.descripcion)}</td>
          <td class="num">${editable ? `<input type="number" class="num-input" data-field="valor" value="${m.valor || ''}">` : fmtMoney(m.valor)}</td>
          <td>${editable ? '<button class="row-del" data-action="del">×</button>' : ''}</td>
        </tr>
      `).join('') : '<tr><td colspan="4" class="empty-note">No has registrado movimientos del extracto para esta cuenta.</td></tr>'}
    </tbody>
    <tfoot><tr><td colspan="2">Total extracto</td><td class="num">${fmtMoney(saldoBanco)}</td><td></td></tr></tfoot>
  `;

  librosTable.innerHTML = `
    <thead><tr><th>Fecha</th><th>Doc.</th><th>Descripción</th><th class="num">Débito</th><th class="num">Crédito</th></tr></thead>
    <tbody>
      ${librosLineas.length ? librosLineas.map(a => `
        <tr>
          <td>${fmtDate(a.fecha)}</td>
          <td class="code">${escapeAttr(a.prefijo)}-${escapeAttr(a.numero)}</td>
          <td>${escapeAttr(a.descripcion)}</td>
          <td class="num">${a.debito ? fmtMoney(a.debito) : ''}</td>
          <td class="num">${a.credito ? fmtMoney(a.credito) : ''}</td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="empty-note">Esta cuenta no tiene movimientos contabilizados.</td></tr>'}
    </tbody>
    <tfoot><tr><td colspan="2">Saldo</td><td></td><td class="num" colspan="2">${fmtMoney(saldoLibros)}</td></tr></tfoot>
  `;

  if(!editable) return;
  table.querySelectorAll('[data-field]').forEach(input => {
    input.addEventListener('input', (e) => {
      const id = e.target.closest('tr').dataset.id;
      const m = state.conciliacion.find(x => x.id === id);
      if(!m) return;
      const f = e.target.dataset.field;
      m[f] = f === 'valor' ? (parseFloat(e.target.value) || 0) : e.target.value;
      scheduleSave();
      renderConciliacionBody();
    });
  });
  table.querySelectorAll('[data-action="del"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.target.closest('tr').dataset.id;
      if(!confirm('¿Eliminar este movimiento del extracto?')) return;
      state.conciliacion = state.conciliacion.filter(x => x.id !== id);
      scheduleSave();
      renderConciliacionBody();
    });
  });
}

/* ---------------------------------------------------------
   RUT: CARGA, EXTRACCIÓN AUTOMÁTICA, IMAGEN Y BÚSQUEDA
--------------------------------------------------------- */
if(typeof pdfjsLib !== 'undefined'){
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  } catch(e){ /* noop */ }
}

function setRutStatus(text){
  const el = document.getElementById('rutStatus');
  if(el) el.textContent = text;
}

async function processRutPdf(file){
  if(typeof pdfjsLib === 'undefined' || window.__pdfLoadFailed){
    alert('No se pudo cargar el lector de PDF (revisa tu conexión a internet) e inténtalo de nuevo.');
    return;
  }
  setRutStatus('Leyendo el PDF…');
  try{
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    const images = [];
    let fullText = '';

    for(let i = 1; i <= pdf.numPages; i++){
      setRutStatus(`Leyendo página ${i} de ${pdf.numPages}…`);
      const page = await pdf.getPage(i);

      // Renderizar cada página como imagen para previsualizar
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      images.push(canvas.toDataURL('image/jpeg', 0.72));

      // Extraer el texto de esa misma página
      const content = await page.getTextContent();
      fullText += reconstructLines(content.items) + '\n';
    }

    state.empresa.rutImages = images;
    state.empresa.rutText = fullText;

    if(fullText.trim().length < 60){
      const quiereOcr = confirm('Este RUT parece un escaneo (no tiene texto seleccionable), así que no puedo leerlo con el método normal.\n\n¿Quieres que intente reconocer el texto de la imagen con OCR? Puede tardar unos segundos por página y no es tan preciso como un PDF con texto real.');
      if(quiereOcr){
        await ejecutarOcrSobreImagenes(images);
        return;
      }
      scheduleSave();
      setRutStatus('');
      renderEmpresa();
      alert('Se cargaron las imágenes del PDF. Tendrás que escribir los datos a mano, guiándote por la imagen de abajo.');
      return;
    }

    const extracted = parseRutText(fullText);
    applyExtractedFields(extracted);

    scheduleSave();
    setRutStatus(`RUT cargado correctamente (${pdf.numPages} página${pdf.numPages === 1 ? '' : 's'}).`);
    renderEmpresa();
  } catch(err){
    console.error('Error al leer el RUT', err);
    setRutStatus('');
    alert('No se pudo leer este PDF. Verifica que sea un archivo de RUT válido y no una imagen escaneada sin texto.');
  }
}

// OCR de respaldo (Tesseract.js) para RUT escaneados como imagen, sin texto seleccionable.
async function ejecutarOcrSobreImagenes(images){
  if(typeof Tesseract === 'undefined' || window.__tesseractLoadFailed){
    alert('No se pudo cargar el módulo de OCR (Tesseract.js). Revisa tu conexión a internet e inténtalo de nuevo.');
    setRutStatus('');
    renderEmpresa();
    return;
  }
  try{
    let textoOcr = '';
    for(let i = 0; i < images.length; i++){
      setRutStatus(`Reconociendo texto por OCR — página ${i + 1} de ${images.length}… (puede tardar un momento)`);
      const { data } = await Tesseract.recognize(images[i], 'spa');
      textoOcr += (data && data.text ? data.text : '') + '\n';
    }
    state.empresa.rutText = textoOcr;
    if(textoOcr.trim().length < 30){
      setRutStatus('');
      scheduleSave();
      renderEmpresa();
      alert('El OCR no logró reconocer texto útil en esta imagen. Tendrás que escribir los datos a mano.');
      return;
    }
    const extracted = parseRutText(textoOcr);
    applyExtractedFields(extracted);
    scheduleSave();
    setRutStatus('RUT leído por OCR — revisa con cuidado, el reconocimiento de imagen no es 100% exacto.');
    renderEmpresa();
  } catch(err){
    console.error('Error de OCR', err);
    setRutStatus('');
    alert('No se pudo reconocer el texto de la imagen mediante OCR.');
    renderEmpresa();
  }
}

// Permite cargar el RUT también como foto/imagen (jpg, png) cuando no se tiene el PDF.
async function processRutImagen(file){
  setRutStatus('Leyendo la imagen…');
  try{
    const dataUrl = await fileToDataUrl(file);
    state.empresa.rutImages = [dataUrl];
    scheduleSave();
    renderEmpresa();
    await ejecutarOcrSobreImagenes([dataUrl]);
  } catch(err){
    console.error('Error al leer la imagen del RUT', err);
    setRutStatus('');
    alert('No se pudo leer esta imagen.');
  }
}

// Agrupa los fragmentos de texto del PDF por línea (según su posición vertical).
// Importante: los PDF generados por formularios (como el RUT) no siempre entregan
// los fragmentos en orden de lectura, así que primero se reordenan por posición
// (de arriba a abajo, y dentro de cada línea, de izquierda a derecha).
function reconstructLines(items){
  const sorted = [...items].sort((a, b) => {
    const ya = a.transform[5], yb = b.transform[5];
    if(Math.abs(ya - yb) > 3) return yb - ya;
    return a.transform[4] - b.transform[4];
  });
  const lines = [];
  let currentY = null;
  let currentLine = [];
  sorted.forEach(it => {
    const y = Math.round(it.transform[5]);
    if(currentY === null || Math.abs(y - currentY) > 3){
      if(currentLine.length) lines.push(currentLine.join(' '));
      currentLine = [it.str];
      currentY = y;
    } else {
      currentLine.push(it.str);
    }
  });
  if(currentLine.length) lines.push(currentLine.join(' '));
  return lines.join('\n');
}

function stripAccentsRut(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Heurística de extracción de campos comunes del RUT (DIAN). No es infalible:
// busca las etiquetas usuales del formulario y toma el texto más cercano.
function parseRutText(text){
  // Parser específico para el RUT DIAN. El PDF distribuye etiquetas y valores
  // en columnas, por lo que NO debemos tomar ciegamente "la siguiente línea".
  const raw = String(text || '').replace(/\r/g,'');
  const norm = stripAccentsRut(raw).toUpperCase();
  const lines = raw.split('\n').map(x => x.trim());
  const linesNorm = norm.split('\n').map(x => x.trim());
  const result = {};

  const clean = v => String(v || '').replace(/\s+/g,' ').trim();
  const digits = v => String(v || '').replace(/\D/g,'');
  const alpha = v => clean(v).replace(/\s{2,}/g,' ');

  function nextNonEmpty(index, max=2){
    for(let j=index+1; j<=Math.min(index+max, lines.length-1); j++){
      if(lines[j]) return lines[j];
    }
    return '';
  }
  function lineAfter(re){
    for(let i=0;i<linesNorm.length;i++){
      if(re.test(linesNorm[i])) return nextNonEmpty(i,2);
    }
    return '';
  }
  function lineWith(re){
    return linesNorm.findIndex(l => re.test(l));
  }
  function valueAfterLabel(re, opts={}){
    const i=lineWith(re);
    if(i<0) return '';
    const original=lines[i]||'';
    const match=original.match(re);
    let same='';
    if(match) same=original.slice(match.index+match[0].length).replace(/^[:\-\s]+/,'').trim();
    if(opts.sameLineOnly) return clean(same);
    return clean(same || nextNonEmpty(i,2));
  }
  function extractCodeDateLine(re){
    const i=lineWith(re);
    if(i<0) return {code:'',date:''};
    // En el RUT los códigos y fechas suelen estar en la línea siguiente,
    // separados por espacios entre dígitos.
    const v=nextNonEmpty(i,3);
    const nums=v.match(/\d(?:[\s\-\/]?\d){3,}/g) || [];
    const compact=nums.map(digits).filter(x=>x.length>=4);
    let code='', date='';
    if(compact.length>=2){ code=compact[0]; date=compact[1]; }
    else if(compact.length===1){ code=compact[0]; }
    return {code,date};
  }

  // NIT y DV: tomar los datos de las casillas 5 y 6, no el número de formulario.
  const nitIdx=lineWith(/5\.\s*NUMERO DE IDENTIFICACION TRIBUTARIA/);
  if(nitIdx>=0){
    const candidate=nextNonEmpty(nitIdx,2);
    const compact=digits(candidate);
    // En la casilla 5 aparece el NIT y, a continuación, la casilla 6 (DV).
    // Tomamos el primer bloque de 9/10 dígitos y el dígito siguiente como DV.
    if(compact.length>=10){
      result.nit=compact.slice(0, compact.length>=11 ? 10 : compact.length-1);
      if(compact.length>=11) result.dv=compact.slice(10,11);
    }
  }
  const dvIdx=lineWith(/6\.\s*DV\b/);
  if(dvIdx>=0 && !result.dv){
    const around=[lines[dvIdx], nextNonEmpty(dvIdx,2)].join(' ');
    const compact=digits(around);
    if(compact.length) result.dv=compact.slice(-1);
  }
  // Fallback muy restringido: NIT de 9-10 dígitos, evitando número de formulario.
  if(!result.nit){
    const candidates=(raw.match(/\b\d(?:[\s\.]?\d){8,12}\b/g)||[]).map(digits).filter(x=>x.length>=9 && x.length<=10);
    const form=lines.find(x=>/NUMERO DE FORMULARIO/i.test(x));
    const formDigits=digits(form);
    result.nit=candidates.find(x=>x!==formDigits) || candidates[0] || '';
  }
  if(!result.dv){
    const m=norm.match(/6\.\s*DV[^\n]*\n[^\n]*?\b(\d)\b/);
    if(m) result.dv=m[1];
  }

  // Tipo de contribuyente / documento.
  // La casilla 24 es la fuente exclusiva para el tipo de contribuyente.
  // Primero intentamos extraer literalmente el texto que aparece en esa casilla,
  // evitando arrastrar los códigos/números de las casillas vecinas.
  const tipoIdx=lineWith(/24\.\s*TIPO DE CONTRIBUYENTE/);
  if(tipoIdx>=0){
    const v=[lines[tipoIdx], nextNonEmpty(tipoIdx,2)].join(' ').replace(/24\.\s*TIPO DE CONTRIBUYENTE/i,'').trim();
    const vn=stripAccentsRut(v).toUpperCase();
    const tipoPat=/PERSONA\s+NATURAL\s+O\s+SUCESION\s+ILIQUIDA|PERSONA\s+JURIDICA|PERSONA\s+NATURAL|SUCESION\s+ILIQUIDA|GRAN\s+CONTRIBUYENTE|REGIMEN\s+SIMPLE|NO\s+RESPONSABLE\s+DE\s+IVA/i;
    const tm=vn.match(tipoPat);
    if(tm) result.tipoContribuyente=clean(tm[0]);

    const dm=vn.match(/CEDULA\s+DE\s+CIUDADANIA|NIT|TARJETA\s+DE\s+IDENTIDAD|PASAPORTE|CEDULA\s+DE\s+EXTRANJERIA|EXTRANJERIA/i);
    if(dm) result.tipoDocumento=clean(dm[0]);

    // Si la plantilla del RUT cambia, conservar como respaldo solo el texto
    // previo al tipo de documento, sin números de casillas.
    if(!result.tipoContribuyente){
      const docPos=v.search(/CEDULA\s+DE\s+CIUDADANIA|NIT|TARJETA\s+DE\s+IDENTIDAD|PASAPORTE|CEDULA\s+DE\s+EXTRANJERIA|EXTRANJERIA/i);
      if(docPos>0) result.tipoContribuyente=clean(v.slice(0,docPos).replace(/\b\d+\b/g,' '));
    }
  }

  // Persona natural: las casillas 31-34 son la fuente correcta del nombre.
  const nameIdx=lineWith(/31\.\s*PRIMER APELLIDO.*32\.\s*SEGUNDO APELLIDO.*33\.\s*PRIMER NOMBRE.*34\.\s*OTROS NOMBRES/);
  if(nameIdx>=0){
    const v=nextNonEmpty(nameIdx,2);
    const parts=v.split(/\s{2,}|\s+/).filter(Boolean);
    // Con el RUT generado por DIAN normalmente aparecen 4 columnas.
    if(parts.length>=4){
      result.primerApellido=parts[0];
      result.segundoApellido=parts[1];
      result.primerNombre=parts[2];
      result.otrosNombres=parts.slice(3).join(' ');
    }
  }
  if(result.primerApellido || result.primerNombre){
    result.nombre=[result.primerApellido,result.segundoApellido,result.primerNombre,result.otrosNombres].filter(Boolean).join(' ').trim();
  } else {
    // Solo para personas jurídicas: casilla 35. No tomar nunca 36/37 como razón social.
    const rsIdx=lineWith(/^35\.\s*RAZON SOCIAL\s*$/);
    if(rsIdx>=0){
      const v=nextNonEmpty(rsIdx,1);
      if(v && !/^36\./.test(v)) result.nombre=clean(v);
    }
  }

  // Casillas 36-37: si están vacías, quedan vacías. Nunca copiar etiquetas,
  // ubicación u otros datos de columnas vecinas.
  const ncIdx=lineWith(/^36\.\s*NOMBRE COMERCIAL/);
  if(ncIdx>=0){
    const v=nextNonEmpty(ncIdx,1);
    if(v && !/^37\.|^UBICACION|^38\./.test(v)) result.nombreComercial=clean(v);
  }
  const sigIdx=lineWith(/37\.\s*SIGLA/);
  if(sigIdx>=0){
    const v=nextNonEmpty(sigIdx,1);
    if(v && !/^UBICACION|^38\./.test(v)) result.sigla=clean(v);
  }

  // UBICACIÓN: casillas 38-45. Preferimos estas sobre las casillas 29-30.
  const ubIdx=lineWith(/38\.\s*PAIS.*39\.\s*DEPARTAMENTO.*40\.\s*CIUDAD\/MUNICIPIO/);
  if(ubIdx>=0){
    const v=nextNonEmpty(ubIdx,2);
    // Para el RUT DIAN los valores vienen como: COLOMBIA 169 MAGDALENA 47 SANTA MARTA 001
    const vm=stripAccentsRut(v).toUpperCase();
    const compactLine=vm.replace(/(\d)\s+(?=\d)/g,'$1');
    const deptMatch=compactLine.match(/(?:COLOMBIA\s+)?(\d{3})\s+([A-Z][A-Z ]+?)\s+(\d{2})\s+([A-Z][A-Z .'-]+?)\s+(\d{3})$/);
    if(deptMatch){ result.departamento=clean(deptMatch[2]); result.ciudad=clean(deptMatch[4]); result.departamentoCodigo=deptMatch[1]; result.ciudadCodigoPrefijo=deptMatch[3]; result.municipioCodigo=deptMatch[5]; }
    else {
      const words=v.split(/\s{2,}/).map(clean).filter(Boolean);
      if(words.length>=3){ result.departamento=words[1]; result.ciudad=words[2].replace(/\s+\d{3}$/,''); }
      const codePair=v.match(/\b(\d{2})\s+[A-Z][A-Z .'-]+?\s+(\d{3})\b/i);
      if(codePair){ result.ciudadCodigoPrefijo=codePair[1]; result.municipioCodigo=codePair[2]; }
    }
  }

  const dirIdx=lineWith(/^41\.\s*DIRECCION PRINCIPAL/);
  if(dirIdx>=0){ const v=nextNonEmpty(dirIdx,1); if(v && !/^42\./.test(v)) result.direccion=clean(v); }
  const email=(raw.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';
  if(email) result.correo=email.toUpperCase();

  // Teléfonos: leer EXCLUSIVAMENTE las casillas 44 y 45.
  // En los PDF DIAN las etiquetas suelen estar en una línea y los dos valores
  // aparecen juntos en la siguiente; nunca se mezclan con otras casillas.
  const contactIdx=lineWith(/43\.\s*CODIGO POSTAL.*44\.\s*TELEFONO 1.*45\.\s*TELEFONO 2/);
  if(contactIdx>=0){
    const candidates=[lines[contactIdx], nextNonEmpty(contactIdx,2)].filter(Boolean);
    const joined=candidates.join(' ');
    const vn=stripAccentsRut(joined).toUpperCase();
    const m44=vn.match(/44\.\s*TELEFONO 1\s*([\d .-]+?)(?=45\.\s*TELEFONO 2|$)/i);
    const m45=vn.match(/45\.\s*TELEFONO 2\s*([\d .-]+)/i);
    if(m44) result.telefono=digits(m44[1]);
    if(m45) result.telefono2=digits(m45[1]);
    if(!result.telefono || !result.telefono2){
      const valueLine=nextNonEmpty(contactIdx,2);
      const blocks=(valueLine.match(/\d(?:[\s.-]?\d){5,15}/g)||[]).map(digits).filter(x=>x.length>=7);
      if(!result.telefono && blocks[0]) result.telefono=blocks[0];
      if(!result.telefono2 && blocks[1]) result.telefono2=blocks[1];
    }
  }

  // Fecha de expedición: en el RUT corresponde a la fecha de "Generación"
  // que aparece al final del documento, no a la fecha de inicio de actividades.
  const genMatch=raw.match(/Fecha\s+generaci[oó]n\s+documento\s+PDF\s*:\s*(\d{2}[-\/]\d{2}[-\/]\d{4})/i);
  if(genMatch) result.fechaExpedicionRut=genMatch[1].replace(/-/g,'/');

  // Actividades económicas: tomar exclusivamente las casillas 46, 48 y 50.
  // 47 y 49 son las fechas de inicio y no se muestran como actividades.
  const actIdx=lineWith(/ACTIVIDAD PRINCIPAL/);
  if(actIdx>=0){
    let v='';
    for(let j=actIdx+1;j<Math.min(actIdx+12,lines.length);j++){
      const candidate=lines[j]||'';
      const compactCandidate=digits(candidate);
      // Buscamos la fila que contiene los datos de 46, 47, 48, 49 y 50.
      // Debe tener dos fechas de 8 dígitos y al menos dos códigos CIIU de 4.
      const dateLike=(compactCandidate.match(/\d{8}/g)||[]).length;
      if(dateLike>=2 && compactCandidate.length>=24 && !/CODIGO|FECHA|ACTIVIDAD ECONOMICA/i.test(candidate)){ v=candidate; break; }
    }
    if(!v){
      // Fallback: en algunas reconstrucciones PDF los títulos están separados;
      // localizar cualquier fila posterior con el patrón 4+8+4+8(+4).
      for(let j=actIdx+1;j<Math.min(actIdx+20,lines.length);j++){
        const candidate=lines[j]||'';
        const compactCandidate=digits(candidate);
        if(/^(?:\d\s*){24,32}$/.test(compactCandidate)){ v=candidate; break; }
      }
    }
    const compactLine=digits(v);
    // Estructura: 46 código (4) + 47 fecha (8) + 48 código (4) + 49 fecha (8) + 50 código (4, opcional).
    if(compactLine.length>=4) result.ciiuPrincipal=compactLine.slice(0,4);
    if(compactLine.length>=12) result.fechaInicioPrincipal=compactLine.slice(4,12);
    if(compactLine.length>=16) result.ciiuSecundaria=compactLine.slice(12,16);
    if(compactLine.length>=24) result.fechaInicioSecundaria=compactLine.slice(16,24);
    if(compactLine.length>=28) result.ciiuOtra=compactLine.slice(24,28);
  }

  // Código postal solicitado: tomarlo a partir de las casillas 29 (departamento)
  // y 30 (ciudad/municipio). En el RUT DIAN estos códigos se muestran junto a
  // la ubicación; para Santa Marta, por ejemplo, 47 + 001 = 47001.
  const loc29Idx=lineWith(/29\.\s*DEPARTAMENTO/);
  const loc30Idx=lineWith(/30\.\s*CIUDAD\/MUNICIPIO/);
  const postalSource=[loc29Idx>=0?nextNonEmpty(loc29Idx,2):'', loc30Idx>=0?nextNonEmpty(loc30Idx,2):'', result.departamentoCodigo||'', result.ciudadCodigoPrefijo||'', result.municipioCodigo||''].join(' ');
  const postalNorm=stripAccentsRut(postalSource).toUpperCase().replace(/(\d)\s+(?=\d)/g,'$1');
  const postalMatch=postalNorm.match(/(?:^|\s)(\d{2})\s+[A-Z][A-Z .'-]+?\s+(\d{3})(?:\s|$)/);
  if(postalMatch) result.codigoPostal=postalMatch[1]+postalMatch[2];
  else if(result.ciudadCodigoPrefijo || result.municipioCodigo) result.codigoPostal=[result.ciudadCodigoPrefijo,result.municipioCodigo].filter(Boolean).join('');

  // Responsabilidades: tomar únicamente los códigos que siguen a la casilla 53.
  const respIdx=lineWith(/53\.\s*CODIGO/);
  if(respIdx>=0){
    const collected=[];
    for(let j=respIdx+1;j<Math.min(respIdx+7,lines.length);j++){
      const l=lines[j];
      if(!l) continue;
      if(/USUARIOS ADUANEROS|EXPORTADORES|IMPORTANTE|ACTUACION DE OFICIO|FIRMA/i.test(l)) break;
      if(/^\d/.test(l) || /IMPT|OBLIGADO|RESPONSABLE DE IVA|NO RESPONSABLE DE IVA/i.test(l)) collected.push(l);
    }
    if(collected.length) result.responsabilidades=collected.join(' · ');
  }

  // MUY IMPORTANTE: un RUT de persona natural no convierte automáticamente al titular
  // en "representante legal". Esa casilla no está diligenciada en este formulario.
  // Por tanto NO se infiere representanteLegal desde el nombre de la persona.

  Object.keys(result).forEach(k=>{ if(!result[k] || /^36\.\s*NOMBRE COMERCIAL/i.test(result[k]) || /^37\.\s*SIGLA/i.test(result[k])) delete result[k]; });
  return result;
}

const FIELD_LABELS = {
  nit: 'NIT', dv: 'DV', tipoDocumento: 'Tipo de documento', tipoContribuyente: 'Tipo de contribuyente',
  fechaExpedicionRut: 'Fecha de expedición del RUT',
  nombre: 'Nombre / razón social', nombreComercial: 'Nombre comercial', sigla: 'Sigla',
  direccion: 'Dirección', departamento: 'Departamento', ciudad: 'Municipio / ciudad',
  codigoPostal: 'Código postal', correo: 'Correo', telefono: 'Teléfono 1', telefono2: 'Teléfono 2',
  ciiuPrincipal: 'CIIU principal', ciiuSecundaria: 'CIIU secundaria', ciiuOtra: 'CIIU otras actividades', departamentoCodigo: 'Código departamento', municipioCodigo: 'Código municipio',
  responsabilidades: 'Responsabilidades tributarias',
  representanteLegal: 'Representante legal',
};

function applyExtractedFields(extracted){
  // Cada carga de RUT reemplaza los datos que provienen del RUT anterior.
  // No se acumulan actividades ni responsabilidades y las casillas vacías
  // del nuevo RUT se dejan vacías.
  const rutFields = [
    'nit','dv','tipoDocumento','tipoContribuyente','nombre','nombreComercial','sigla',
    'direccion','departamento','ciudad','codigoPostal','correo','telefono','telefono2',
    'fechaExpedicionRut','departamentoCodigo','municipioCodigo'
  ];
  rutFields.forEach(key => { state.empresa[key] = extracted[key] || ''; });
  state.empresa.regimen = ''; // El régimen ya no forma parte de la ficha de la empresa.

  // Actividades económicas: reemplazar completamente las del RUT anterior.
  state.empresa.actividades = [];
  const ciiuCatalog = getCiiuCatalog();
  const ciiuDescripcion = codigo => {
    const found = ciiuCatalog.find(x => String(x[0]).trim() === String(codigo).trim());
    return found ? String(found[1] || '').toUpperCase() : '';
  };
  if(extracted.ciiuPrincipal){
    state.empresa.actividades.push({ codigo: extracted.ciiuPrincipal, descripcion: ciiuDescripcion(extracted.ciiuPrincipal), principal: true });
  }
  if(extracted.ciiuSecundaria){
    state.empresa.actividades.push({ codigo: extracted.ciiuSecundaria, descripcion: ciiuDescripcion(extracted.ciiuSecundaria), principal: false });
  }
  if(extracted.ciiuOtra){
    state.empresa.actividades.push({ codigo: extracted.ciiuOtra, descripcion: ciiuDescripcion(extracted.ciiuOtra), principal: false });
  }

  // Responsabilidades tributarias: reemplazar, no acumular.
  state.empresa.responsabilidadesList = [];
  if(extracted.responsabilidades){
    const items = extracted.responsabilidades.split('·').map(t => t.trim()).filter(Boolean);
    items.forEach(desc => state.empresa.responsabilidadesList.push({ codigo: '', descripcion: desc }));
  }

  state.empresa._lastExtracted = extracted;
}

function renderRutSearchResults(query){
  const results = document.getElementById('rutSearchResults');
  const q = query.trim().toLowerCase();
  if(!q){ results.hidden = true; results.innerHTML = ''; return; }
  const lines = state.empresa.rutText.split('\n').map(l => l.trim()).filter(Boolean);
  const matches = lines.filter(l => l.toLowerCase().includes(q)).slice(0, 30);
  if(!matches.length){
    results.innerHTML = '<div class="rut-search-result">No se encontró ese texto en el RUT.</div>';
    results.hidden = false;
    return;
  }
  const escRegex = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + escRegex + ')', 'ig');
  results.innerHTML = matches.map(l => {
    const highlighted = escapeAttr(l).replace(re, '<mark>$1</mark>');
    return `<div class="rut-search-result">${highlighted}</div>`;
  }).join('');
  results.hidden = false;
}

function renderPucTable(){
  const table = document.getElementById('pucTable');
  if(!table) return;
  const q = pucSearchQuery.trim().toLowerCase();
  let rows = state.puc;
  if(q){
    rows = rows.filter(a => a.code.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q));
  }
  rows = [...rows].sort((a,b) => a.code.localeCompare(b.code, undefined, { numeric: true }));

  table.innerHTML = `
    <thead><tr><th>Código</th><th>Descripción</th><th>Tipo</th><th></th></tr></thead>
    <tbody>
      ${rows.map(a => `
        <tr data-code="${escapeAttr(a.code)}">
          <td class="code">${escapeAttr(a.code)}</td>
          <td>${escapeAttr(a.desc)}</td>
          <td>${MAJOR_CLASS_LABELS[a.type] || a.type}</td>
          <td><button class="row-del" data-action="del-puc">×</button></td>
        </tr>
      `).join('')}
    </tbody>
  `;
  if(!rows.length){
    table.innerHTML += '';
    table.querySelector('tbody').innerHTML = '<tr><td colspan="4" class="empty-note">No hay cuentas que coincidan con la búsqueda.</td></tr>';
  }

  table.querySelectorAll('[data-action="del-puc"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const code = e.target.closest('tr').dataset.code;
      if(!confirm(`¿Eliminar la cuenta ${code}?`)) return;
      state.puc = state.puc.filter(a => a.code !== code);
      logAudit('Cuenta PUC eliminada', code);
      scheduleSave();
      renderPucTable();
    });
  });
}

function openTerceroModal(idx){
  terceroEditIdx = idx;
  const t = idx === null ? { nit:'', nombre:'', tipoContribuyente:'', regimen:'', correo:'', telefono:'', direccion:'', tipo:'ambos' } : state.terceros[idx];
  document.getElementById('terceroModalTitle').textContent = idx === null ? 'Agregar tercero' : 'Editar tercero';
  document.getElementById('tfNit').value = t.nit || '';
  document.getElementById('tfNombre').value = t.nombre || '';

  document.getElementById('tfDireccion').value = t.direccion || '';

  document.getElementById('terceroModalOverlay').hidden = false;
}

function closeTerceroModal(){
  document.getElementById('terceroModalOverlay').hidden = true;
  terceroEditIdx = null;
}

function saveTerceroModal(){
  const data = {
    nit: document.getElementById('tfNit').value.trim(),
    nombre: document.getElementById('tfNombre').value.trim(),
    tipoContribuyente: document.getElementById('tfTipoContribuyente').value.trim(),
    regimen: document.getElementById('tfRegimen').value.trim(),
    correo: document.getElementById('tfCorreo').value.trim(),
    telefono: document.getElementById('tfTelefono').value.trim(),
    direccion: document.getElementById('tfDireccion').value.trim(),
    tipo: document.getElementById('tfTipo').value,
  };
  const missing = TERCERO_REQUIRED.filter(k => !data[k]);
  if(missing.length){
    const labels = { nit:'NIT', nombre:'Razón social', tipoContribuyente:'Tipo de contribuyente', regimen:'Régimen', correo:'Correo', telefono:'Teléfono' };
    document.getElementById('terceroModalError').textContent = 'Faltan campos obligatorios: ' + missing.map(k => labels[k]).join(', ');
    return;
  }
  // Validar NIT duplicado (excepto si estamos editando el mismo)
  const dup = state.terceros.some((t, i) => t.nit === data.nit && i !== terceroEditIdx);
  if(dup){
    document.getElementById('terceroModalError').textContent = 'Ya existe un tercero con ese NIT.';
    return;
  }
  if(terceroEditIdx === null){
    state.terceros.push(data);
    logAudit('Tercero creado', `${data.nit} · ${data.nombre}`);
  } else {
    state.terceros[terceroEditIdx] = data;
    logAudit('Tercero editado', `${data.nit} · ${data.nombre}`);
  }
  scheduleSave();
  closeTerceroModal();
  renderTercerosBody();
}

/* --- Documento en curso (encabezado + líneas, partida doble) --- */
function nextNumeroPara(prefijo){
  const tipo = state.tiposDoc.find(t => t.prefijo === prefijo);
  const inicial = tipo && tipo.consecutivoInicial ? Number(tipo.consecutivoInicial) : 1;
  const maxUsado = state.asientos.filter(a => a.prefijo === prefijo).reduce((m,a) => Math.max(m, Number(a.numero)||0), 0);
  return Math.max(inicial, maxUsado + 1);
}

function startNewDocumento(){
  const prefijo = state.tiposDoc[0] ? state.tiposDoc[0].prefijo : '';
  const tipo = state.tiposDoc.find(t => t.prefijo === prefijo);
  docEnCurso = {
    prefijo, documento: tipo ? tipo.documento : '', numero: nextNumeroPara(prefijo), fecha: todayISO(), descripcion: '',
    lineas: [{ id: uid(), nit: '', cuenta: '', centroCosto: '', subCentroCosto:'', localizacion:'', detalle: '', debito: 0, credito: 0 }],
  };
  renderDocumentoEnCurso();
}

function cancelarDocumento(){
  if(!confirm('¿Descartar este documento sin guardar?')) return;
  docEnCurso = null;
  document.getElementById('documentoEnCursoCard').hidden = true;
}

function docLineasDiff(){
  let d = 0, c = 0;
  docEnCurso.lineas.forEach(l => { d += Number(l.debito) || 0; c += Number(l.credito) || 0; });
  return { debito: d, credito: c, diferencia: d - c };
}

  document.getElementById('docPrefijo').addEventListener('change', (e) => {

    state.tiposDoc.push({ prefijo: prefijo.trim(), documento: documento.trim(), consecutivoInicial: inicial });
    scheduleSave();
    docEnCurso.prefijo = prefijo.trim();
    docEnCurso.documento = documento.trim();
    docEnCurso.numero = nextNumeroPara(docEnCurso.prefijo);
    renderDocumentoEnCurso();
  });

  document.getElementById('btnQuickCuenta').addEventListener('click', () => {

    if(getAccount(code.trim())){ alert('Ya existe una cuenta con ese código.'); return; }

    const nombre = prompt('Razón social / nombre:') || '';
    const tipoContribuyente = prompt('Tipo de contribuyente:') || '';
    const regimen = prompt('Régimen:') || '';
    const correo = prompt('Correo:') || '';
    const telefono = prompt('Teléfono:') || '';
    if(!nombre.trim() || !tipoContribuyente.trim() || !regimen.trim() || !correo.trim() || !telefono.trim()){

function updateDocDiffBanner(){
  const card = document.getElementById('documentoEnCursoCard');
  if(!card) return;
  const banner = card.querySelector('.diff-banner');
  if(!banner) return;
  const diff = docLineasDiff();
  const ok = Math.abs(diff.diferencia) < 1 && docEnCurso.lineas.length >= 2;
  banner.className = 'diff-banner ' + (ok ? 'ok' : 'bad');
  banner.innerHTML = ok
    ? `✓ Partida cuadrada — Débito ${fmtMoney(diff.debito)} = Crédito ${fmtMoney(diff.credito)}`
    : `✗ Débito ${fmtMoney(diff.debito)} vs Crédito ${fmtMoney(diff.credito)} — deben ser iguales y tener mínimo 2 líneas para guardar.`;
}

function guardarDocumento(){
  if(!docEnCurso.fecha){ alert('Escribe la fecha del documento.'); return; }
  if(isPeriodoCerrado(docEnCurso.fecha)){
    const [y,m] = docEnCurso.fecha.split('-').map(Number);
    alert(`El período ${periodoLabel(y,m)} está cerrado. Reábrelo desde "Cierre de períodos" para poder registrar aquí.`);
    return;
  }
  if(!docEnCurso.numero || docEnCurso.numero < 1){ alert('Escribe un número de documento válido.'); return; }
  const yaExiste = state.asientos.some(a => a.prefijo === docEnCurso.prefijo && Number(a.numero) === Number(docEnCurso.numero) && !(docEnCurso.editingKey === a.prefijo+'-'+a.numero));
  if(yaExiste){ alert(`Ya existe un documento ${docEnCurso.prefijo}-${docEnCurso.numero}. Cambia el número.`); return; }
  if(docEnCurso.lineas.length < 2){ alert('Un documento en partida doble necesita al menos 2 líneas.'); return; }
  const sinNit = docEnCurso.lineas.some(l => !String(l.nit || '').trim());
  if(sinNit){ alert('Todas las líneas deben tener un NIT de tercero asociado.'); return; }
  const sinCuenta = docEnCurso.lineas.some(l => !String(l.cuenta || '').trim());
  if(sinCuenta){ alert('Todas las líneas deben tener una cuenta.'); return; }
  const diff = docLineasDiff();
  if(Math.abs(diff.diferencia) >= 1){
    alert(`El documento no cuadra (débito ${fmtMoney(diff.debito)} vs crédito ${fmtMoney(diff.credito)}). Ajusta los valores antes de guardar.`);
    return;
  }
  if(docEnCurso.editingKey){
    const [pfx,numRaw]=docEnCurso.editingKey.split('-');
    state.asientos = state.asientos.filter(a => !(a.prefijo===pfx && Number(a.numero)===Number(numRaw)));
  }
  docEnCurso.lineas.forEach((l, i) => {
    state.asientos.push({ id: uid(), prefijo: docEnCurso.prefijo, documento: docEnCurso.documento, numero: docEnCurso.numero, fecha: docEnCurso.fecha, descripcion: docEnCurso.descripcion, observacion: String(i + 1), nit: l.nit, cuenta: l.cuenta, centroCosto: l.centroCosto || '', subCentroCosto: l.subCentroCosto || '', localizacion: l.localizacion || '', detalle: l.detalle, debito: l.debito, credito: l.credito, soporte: docEnCurso.soporte || null });
  });
  logAudit(docEnCurso.editingKey ? 'Comprobante editado' : 'Comprobante creado', `${docEnCurso.prefijo}-${docEnCurso.numero} · ${docEnCurso.descripcion || ''} · ${fmtMoney(diff.debito)}`);
  scheduleSave();
  docEnCurso = null;
  document.getElementById('documentoEnCursoCard').hidden = true;
  renderAsientosBody();
  renderAsientosDiffBanner();
}

function renderAsientosDiffBanner(){
  const wrap = document.getElementById('asientosDiffBanner');
  if(!wrap) return;
  const t = globalTotals();
  const ok = Math.abs(t.diferencia) < 1;
  wrap.innerHTML = `
    <div class="diff-banner ${ok ? 'ok' : 'bad'}">
      ${ok
        ? `✓ Cuadrado — Total débito ${fmtMoney(t.debito)} = Total crédito ${fmtMoney(t.credito)}`
        : `✗ Descuadre de ${fmtMoney(Math.abs(t.diferencia))} — Débito ${fmtMoney(t.debito)} vs Crédito ${fmtMoney(t.credito)}`}
    </div>
  `;
}

function renderAsientosBody(){
  const body = document.getElementById('asientosBody');
  if(!body) return;

  const q = asientosSearchQuery.trim().toLowerCase();
  let rows = [...state.asientos];
  if(q){
    rows = rows.filter(a =>
      String(a.numero).includes(q) ||
      (a.descripcion||'').toLowerCase().includes(q) ||
      (a.observacion||'').toLowerCase().includes(q) ||
      (a.cuenta||'').toLowerCase().includes(q) ||
      getAccountDesc(a.cuenta).toLowerCase().includes(q) ||
      getTerceroNombre(a.nit).toLowerCase().includes(q) ||
      (a.nit||'').toLowerCase().includes(q)
    );
  }
  rows.sort((a,b) => (a.fecha||'').localeCompare(b.fecha||'') || a.prefijo.localeCompare(b.prefijo) || (Number(a.numero)-Number(b.numero)));

  if(!rows.length){
    body.innerHTML = '<tr><td colspan="16" class="empty-note">No hay líneas que coincidan.</td></tr>';
    return;
  }

  let prevKey = null;
  body.innerHTML = rows.map(a => {
    const key = a.prefijo + '-' + a.numero;
    const newGroup = key !== prevKey;
    prevKey = key;
    const cerrado = isPeriodoCerrado(a.fecha);
    const ro = cerrado ? 'readonly disabled' : '';
    return `
      <tr data-id="${a.id}" style="${newGroup ? 'border-top:2px solid var(--ink);' : ''}${cerrado ? 'opacity:0.6;' : ''}">
        <td><input type="date" data-field="fecha" value="${escapeAttr(a.fecha)}" ${ro}></td>
        <td><select data-field="prefijo" ${cerrado?'disabled':''}>${tiposDocOptionsHTML(a.prefijo)}</select></td>
        <td><input type="number" data-field="numero" class="num-input" value="${a.numero}" style="width:50px" ${ro}></td>
        <td><input data-field="descripcion" value="${escapeAttr(a.descripcion)}" style="min-width:130px" ${ro}></td>
        <td><input data-field="observacion" value="${escapeAttr(a.observacion)}" style="width:50px" ${ro}></td>
        <td><input data-field="nit" list="tercerosDatalist" value="${escapeAttr(a.nit)}" style="width:100px" ${ro}></td>
        <td>${escapeAttr(getTerceroNombre(a.nit))}</td>
        <td><input data-field="cuenta" list="pucDatalist" value="${escapeAttr(a.cuenta)}" class="code" style="width:90px" ${ro}></td>
        <td><select data-field="centroCosto" ${cerrado?'disabled':''} style="width:90px">${centrosCostoOptionsHTML(a.centroCosto)}</select></td>
        <td><input data-field="detalle" value="${escapeAttr(a.detalle)}" style="min-width:120px" ${ro}></td>
        <td><input type="number" data-field="debito" class="num-input" value="${a.debito || ''}" ${ro}></td>
        <td><input type="number" data-field="credito" class="num-input" value="${a.credito || ''}" ${ro}></td>
        <td>${a.soporte ? `<button class="btn btn-sm" data-action="ver-soporte" title="${escapeAttr(a.soporte.name)}">📎</button>` : ''}</td>
        <td>${cerrado ? '🔒' : `<button class="btn btn-sm" data-action="edit-doc">Editar documento</button><button class="row-del" data-action="del">×</button>`}</td>
      </tr>
    `;
  }).join('');

  body.querySelectorAll('input, select').forEach(input => {
    input.addEventListener('input', (e) => {
      const id = e.target.closest('tr').dataset.id;
      const a = state.asientos.find(x => x.id === id);
      if(!a) return;
      if(isPeriodoCerrado(a.fecha)) return; // seguridad adicional: el período está cerrado
      const field = e.target.dataset.field;
      if(field === 'debito' || field === 'credito' || field === 'numero'){
        a[field] = e.target.value === '' ? 0 : parseFloat(e.target.value);
      } else {
        a[field] = e.target.value;
      }
      if(field === 'prefijo'){
        const tipo = state.tiposDoc.find(t => t.prefijo === e.target.value);
        a.documento = tipo ? tipo.documento : '';
      }
      scheduleSave();
      renderAsientosDiffBanner();
      if(field === 'nit'){
        e.target.closest('tr').children[6].textContent = getTerceroNombre(a.nit);
      }
    });
  });

  body.querySelectorAll('[data-action="ver-soporte"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.target.closest('tr').dataset.id;
      const a = state.asientos.find(x => x.id === id);
      if(a && a.soporte) window.open(a.soporte.dataUrl, '_blank');
    });
  });

  body.querySelectorAll('[data-action="del"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.target.closest('tr').dataset.id;
      const a = state.asientos.find(x => x.id === id);
      if(a && isPeriodoCerrado(a.fecha)){ alert('Este período está cerrado.'); return; }
      if(!confirm('¿Eliminar esta línea del asiento?')) return;
      state.asientos = state.asientos.filter(x => x.id !== id);
      if(a) logAudit('Línea de asiento eliminada', `${a.prefijo}-${a.numero} · ${a.cuenta} · ${fmtMoney(a.debito||a.credito)}`);
      scheduleSave();
      renderAsientosBody();
      renderAsientosDiffBanner();
    });
  });
}

/* ---------------------------------------------------------
   FILTROS COMPARTIDOS (fecha / tercero / rango de cuentas)
--------------------------------------------------------- */
function filteredAsientos(opts){
  opts = opts || {};
  return state.asientos.filter(a => {
    if(opts.desde && a.fecha < opts.desde) return false;
    if(opts.hasta && a.fecha > opts.hasta) return false;
    if(opts.nit && a.nit !== opts.nit) return false;
    if(opts.cuentaDesde && a.cuenta.localeCompare(opts.cuentaDesde, undefined, { numeric: true }) < 0) return false;
    if(opts.cuentaHasta && a.cuenta.localeCompare(opts.cuentaHasta, undefined, { numeric: true }) > 0) return false;
    return true;
  });
}

function accountsFromAsientos(asientosList, types){
  const map = {};
  asientosList.forEach(a => {
    if(!map[a.cuenta]) map[a.cuenta] = { debito: 0, credito: 0 };
    map[a.cuenta].debito += Number(a.debito) || 0;
    map[a.cuenta].credito += Number(a.credito) || 0;
  });
  let list = Object.keys(map).map(code => {
    const acc = getAccount(code);
    return { code, desc: acc ? acc.desc : code, type: acc ? acc.type : null, debito: map[code].debito, credito: map[code].credito, saldo: map[code].debito - map[code].credito };
  });
  if(types) list = list.filter(x => types.includes(x.type));
  list.sort((a,b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
  return list;
}

function renderMayorTable(){
  const table = document.getElementById('mayorTable');
  if(!table) return;
  const accounts = accountsFromAsientos(filteredAsientos(mayorFilters));
  const totalDebe = accounts.reduce((s,a) => s + a.debito, 0);
  const totalHaber = accounts.reduce((s,a) => s + a.credito, 0);
  const totalSaldo = accounts.reduce((s,a) => s + a.saldo, 0);

  table.innerHTML = `
    <thead><tr><th>Código</th><th>Descripción</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th></tr></thead>
    <tbody>
      ${accounts.length ? accounts.map(a => `
        <tr>
          <td class="code">${escapeAttr(a.code)}</td>
          <td>${escapeAttr(a.desc)}</td>

function renderAuxTable(){
  const table = document.getElementById('auxTable');

  if(auxFilters.desde) lines = lines.filter(a => a.fecha >= auxFilters.desde);
  if(auxFilters.hasta) lines = lines.filter(a => a.fecha <= auxFilters.hasta);
  if(auxFilters.nit) lines = lines.filter(a => a.nit === auxFilters.nit);
  lines = lines.sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));

  if(auxGroupBy === 'mes'){
    const groups = {};
    lines.forEach(a => {
      const key = (a.fecha || '').slice(0, 7) || 'Sin fecha';
      if(!groups[key]) groups[key] = { debito: 0, credito: 0 };
      groups[key].debito += Number(a.debito) || 0;
      groups[key].credito += Number(a.credito) || 0;
    });
    let running = 0;
    const rows = Object.keys(groups).sort().map(key => {
      running += groups[key].debito - groups[key].credito;

    `;

  }

  if(auxGroupBy === 'movimiento'){
    const groups = {};
    lines.forEach(a => {
      const key = a.prefijo + '-' + a.numero;
      if(!groups[key]) groups[key] = { fecha: a.fecha, descripcion: a.descripcion, debito: 0, credito: 0 };
      groups[key].debito += Number(a.debito) || 0;
      groups[key].credito += Number(a.credito) || 0;
    });
    let running = 0;
    const keys = Object.keys(groups).sort((k1,k2) => (groups[k1].fecha||'').localeCompare(groups[k2].fecha||''));
    const rows = keys.map(key => {
      running += groups[key].debito - groups[key].credito;
      return `<tr><td>${fmtDate(groups[key].fecha)}</td><td class="code">${escapeAttr(key)}</td><td>${escapeAttr(groups[key].descripcion)}</td><td></td>
        <td class="num">${fmtMoney(groups[key].debito)}</td><td class="num">${fmtMoney(groups[key].credito)}</td><td class="num">${fmtMoney(running)}</td></tr>`;
    }).join('');
    table.innerHTML = `
      <thead><tr><th>Fecha</th><th>Documento</th><th>Descripción</th><th></th><th class="num">Débito</th><th class="num">Crédito</th><th class="num">Saldo acum.</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty-note">No hay movimientos que coincidan.</td></tr>'}</tbody>
    `;
    return;
  }

  let running = 0;
  const rowsHTML = lines.map(a => {
    running += (Number(a.debito)||0) - (Number(a.credito)||0);
    return `
      <tr>
        <td>${fmtDate(a.fecha)}</td>
        <td class="code">${escapeAttr(a.prefijo)}-${escapeAttr(a.numero)}</td>
        <td>${escapeAttr(a.descripcion)}</td>

        <td class="num">${a.credito ? fmtMoney(a.credito) : ''}</td>
        <td class="num">${fmtMoney(running)}</td>
      </tr>
    `;
  }).join('');

  table.innerHTML = `
    <thead><tr><th>Fecha</th><th>Doc.</th><th>Descripción</th><th>Tercero</th><th class="num">Débito</th><th class="num">Crédito</th><th class="num">Saldo acum.</th></tr></thead>

  `;
}

function calcularCartera(modo){
  const filtro=modo==='cobrar'?esCuentaCobrar:esCuentaPagar; const porTercero={};
  state.asientos.forEach(a=>{if(!filtro(a.cuenta)||!a.nit)return;if(carteraDesde&&a.fecha<carteraDesde)return;if(carteraHasta&&a.fecha>carteraHasta)return;if(!porTercero[a.nit])porTercero[a.nit]={nit:a.nit,saldo:0,buckets:[0,0,0,0],ultimaFecha:''};const p=porTercero[a.nit];const valor=modo==='cobrar'?((Number(a.debito)||0)-(Number(a.credito)||0)):((Number(a.credito)||0)-(Number(a.debito)||0));p.saldo+=valor;if(a.fecha>p.ultimaFecha)p.ultimaFecha=a.fecha;const dias=Math.max(0,Math.round((new Date(todayISO())-new Date(a.fecha))/86400000));const idx=dias>90?3:dias>60?2:dias>30?1:0;p.buckets[idx]+=valor;});
  return Object.values(porTercero).filter(p=>Math.abs(p.saldo)>=1).sort((a,b)=>Math.abs(b.saldo)-Math.abs(a.saldo));
}

function calcularDepreciacion(activo){
  const costo=Number(activo.costo)||0, residual=Number(activo.valorResidual)||0;
  const metodo=activo.metodoDepreciacion||'linea_recta';
  const vidaMeses=Math.max(1,Math.round((Number(activo.vidaUtilAnios)||1)*12));
  let mesesTranscurridos=0;
  if(activo.fechaCompra){const compra=new Date(activo.fechaCompra),hoy=new Date();mesesTranscurridos=Math.max(0,(hoy.getFullYear()-compra.getFullYear())*12+(hoy.getMonth()-compra.getMonth()));mesesTranscurridos=Math.min(mesesTranscurridos,vidaMeses);}
  const base=Math.max(0,costo-residual); let depMensual=0,depAcumulada=0;
  if(metodo==='linea_recta'){depMensual=base/vidaMeses;depAcumulada=Math.min(depMensual*mesesTranscurridos,base);}
  else if(metodo==='suma_digitos'){const suma=vidaMeses*(vidaMeses+1)/2;const acumulPeso=m=>m*(2*vidaMeses-m+1)/2;depAcumulada=Math.min(base*(acumulPeso(mesesTranscurridos)/suma),base);const peso=Math.max(0,vidaMeses-mesesTranscurridos);depMensual=base*(peso/suma);}
  else {const totalUnidades=Number(activo.unidadesTotales)||0, periodo=Number(activo.unidadesPeriodo)||0;depMensual=totalUnidades>0?(base/totalUnidades)*periodo:0;depAcumulada=Math.min(depMensual,base);}
  return {depMensual,depAcumulada,valorLibros:costo-depAcumulada,mesesTranscurridos,vidaMeses,metodo};
}

function rangoAnterior(desde,hasta){ if(!desde||!hasta)return null; const d=new Date(desde), h=new Date(hasta); const dias=Math.round((h-d)/86400000); const nh=new Date(d); nh.setDate(nh.getDate()-1); const nd=new Date(nh); nd.setDate(nd.getDate()-dias); const iso=x=>x.toISOString().slice(0,10); return {desde:iso(nd),hasta:iso(nh)}; }

function classBlockHTML(accounts, sign){
  // sign: 1 si el saldo natural es débito (activo), -1 si es crédito (pasivo/patrimonio)
  const groups = groupByClass(accounts);
  let total = 0;
  const rowsHTML = groups.map(g => {
    const subtotal = g.items.reduce((s,a) => s + (sign === 1 ? (a.debito - a.credito) : (a.credito - a.debito)), 0);
    total += subtotal;
    const itemsHTML = g.items.map(a => `
      <tr>
        <td class="code">${escapeAttr(a.code)}</td>
        <td>${escapeAttr(a.desc)}</td>
        <td class="num">${fmtMoney(sign === 1 ? (a.debito - a.credito) : (a.credito - a.debito))}</td>
      </tr>
    `).join('');
    return `
      <tr class="class-row"><td class="code">${escapeAttr(g.code)}</td><td colspan="2">${escapeAttr(g.label)}</td></tr>
      ${itemsHTML}
      <tr class="subtotal-row"><td></td><td>Subtotal ${escapeAttr(g.label)}</td><td class="num">${fmtMoney(subtotal)}</td></tr>
    `;
  }).join('');
  return { html: rowsHTML, total };
}

   MÓDULO: INVENTARIOS / COSTEO (PEPS / PROMEDIO)
--------------------------------------------------------- */
function invProducts(){ return Array.isArray(state.productos) ? state.productos : (state.productos = []); }
function invMoves(){ return Array.isArray(state.movInventario) ? state.movInventario : (state.movInventario = []); }
function invRecalc(){
  const products = invProducts();
  const moves = invMoves();
  const by = {};
  products.forEach(p => by[p.id] = { ...p, stock:0, costo:0, valor:0 });
  const sorted = [...moves].sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'') || String(a.id).localeCompare(String(b.id)));
  sorted.forEach(m=>{
    if(!by[m.producto]) return;
    const p=by[m.producto], q=Number(m.cantidad)||0, c=Number(m.costoUnit)||0;
    if(m.tipo==='entrada') { p.stock += q; if(p.metodo==='promedio') p.costo = p.stock ? ((p.costo*(p.stock-q))+(q*c))/p.stock : c; }
    else if(m.tipo==='salida') { p.stock -= q; }
    p.valor = p.stock * (p.metodo==='peps' ? (invPepsUnit(m.producto, sorted) || p.costo || 0) : (p.costo || c));
  });
  return by;
}
function invPepsUnit(producto, moves){
  const p=invProducts().find(x=>x.id===producto); if(!p) return 0;
  const layers=[];
  moves.filter(m=>m.producto===producto).forEach(m=>{
    const q=Number(m.cantidad)||0,c=Number(m.costoUnit)||0;
    if(m.tipo==='entrada' && q>0) layers.push({q,c});
    if(m.tipo==='salida' && q>0){ let left=q; while(left>0&&layers.length){const take=Math.min(left,layers[0].q);layers[0].q-=take;left-=take;if(layers[0].q<=0)layers.shift();} }
  });
  return layers.length ? layers[0].c : 0;
}

  el.innerHTML=`<div class="section-head"><h1>Inventarios / Costeo</h1><p>Control de existencias con valoración <b>PEPS</b> o <b>Promedio ponderado</b>. Los movimientos quedan auditables y pueden exportarse.</p></div>

function renderNomina(){

  <div class="card"><h3>Resumen del período</h3><div class="stat-grid"><div class="stat"><div class="stat-label">Devengado</div><div class="stat-value">${fmtMoney(total('devengado'))}</div></div><div class="stat"><div class="stat-label">Deducciones</div><div class="stat-value">${fmtMoney(total('deducciones'))}</div></div><div class="stat"><div class="stat-label">Neto</div><div class="stat-value">${fmtMoney(total('neto'))}</div></div></div><div class="table-scroll"><table class="ledger"><thead><tr><th>Período</th><th>Empleado</th><th class="num">Devengado</th><th class="num">Deducciones</th><th class="num">Neto</th></tr></thead><tbody>${pays.length?pays.slice().reverse().map(x=>`<tr><td>${escapeAttr(x.periodo)}</td><td>${escapeAttr(x.nombre)}</td><td class="num">${fmtMoney(x.devengado)}</td><td class="num">${fmtMoney(x.deducciones)}</td><td class="num">${fmtMoney(x.neto)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty-note">No hay liquidaciones.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Exportación</h3><p class="empty-note">Exporta la nómina a Excel para revisión o carga en tu proveedor de nómina electrónica. Este módulo no transmite directamente a la DIAN.</p><div class="btn-row"><button class="btn" id="payExcel">Exportar nómina Excel</button></div></div>`;
  document.getElementById('empAdd').onclick=()=>{const documento=document.getElementById('empDoc').value.trim(),nombre=document.getElementById('empNombre').value.trim();if(!documento||!nombre)return alert('Identificación y nombre son obligatorios.');emps.push({id:uid(),tipoDoc:document.getElementById('empTipo').value,documento,nombre,salario:Number(document.getElementById('empSalario').value)||0,cargo:document.getElementById('empCargo').value.trim(),fechaIngreso:document.getElementById('empIngreso').value,contrato:document.getElementById('empContrato').value,activo:true});scheduleSave();renderNomina();};

  document.getElementById('payExcel').onclick=exportNominaExcel;

function exportNominaExcel(){if(typeof XLSX==='undefined')return alert('Motor Excel no disponible.');const wb=XLSX.utils.book_new();const emps=state.empleados||[];const pays=state.nomina||[];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(emps.map(e=>({TipoDocumento:e.tipoDoc,Identificacion:e.documento,Nombre:e.nombre,Cargo:e.cargo,Salario:e.salario,FechaIngreso:e.fechaIngreso,Contrato:e.contrato,Activo:e.activo?'SI':'NO'}))),'Empleados');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pays.map(x=>({Periodo:x.periodo,TipoDocumento:x.empleado?((emps.find(e=>e.id===x.empleado)||{}).tipoDoc||''):'',Identificacion:x.documento,Empleado:x.nombre,Devengado:x.devengado,Deducciones:x.deducciones,Neto:x.neto,IBC:x.ibc,Salud:x.salud,Pension:x.pension,AuxilioTransporte:x.auxilioTransporte,Estado:x.estado}))),'Nomina');XLSX.writeFile(wb,`nomina-${todayStamp()}.xlsx`);}

const EXOG_FORMATS={
  '1001':'Pagos o abonos en cuenta y retenciones practicadas','1003':'Retenciones en la fuente que le practicaron','1005':'IVA descontable','1006':'IVA generado','1007':'Ingresos recibidos','1008':'Cuentas por cobrar','1009':'Cuentas por pagar','1010':'Socios, accionistas, comuneros y/o cooperados','1011':'Información de declaraciones tributarias','1012':'Información de inversiones','1013':'Información de saldos de cuentas','2276':'Ingresos y retenciones por rentas de trabajo y pensiones'
};
const EXOG_CONCEPTS={
 '1001':[['5001','Honorarios y servicios / pagos o abonos en cuenta'],['5002','Compras de bienes y mercancías'],['5003','Arrendamientos'],['5004','Comisiones'],['5005','Otros pagos o abonos en cuenta']],
 '1003':[['1','Retenciones en la fuente que le practicaron'],['2','Retenciones por otros conceptos']],
 '1005':[['1','IVA descontable']], '1006':[['1','IVA generado e impuesto al consumo']],
 '1007':[['4001','Ingresos por actividades ordinarias'],['4002','Otros ingresos']],
 '1008':[['1','Cuentas por cobrar']], '1009':[['1','Cuentas por pagar']],
 '1010':[['1','Socios / accionistas / cooperados']], '1011':[['1','Información de declaraciones tributarias']],
 '1012':[['1','Inversiones']], '1013':[['1','Saldos de cuentas bancarias']],
 '2276':[['1','Rentas de trabajo y pensiones']]
};
function exogDocType(nit){const t=getTercero(nit); return t&&t.tipoDoc?t.tipoDoc:'13';}
function exogAccounts(){
  const used={};
  (state.asientos||[]).forEach(a=>{const c=String(a.cuenta||'').trim();if(c)used[c]=true;});
  return Object.keys(used).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(code=>({code,desc:getAccountDesc(code)}));
}
function exogRulesFor(format){return (state.exogenaReglas||[]).filter(r=>r.activo!==false&&r.formato===format&&r.cuenta);}
function exogSelectedAccounts(format){return new Set(exogRulesFor(format).map(r=>String(r.cuenta)));}
function exogBaseRows(){
  const map={};
  const cfg=state.exogenaConfig||{};
  (state.asientos||[]).forEach(a=>{
    if(cfg.anio && a.fecha && String(a.fecha).slice(0,4)!==String(cfg.anio)) return;
    const nit=String(a.nit||'').trim(), cuenta=String(a.cuenta||'').trim(); if(!nit||!cuenta)return;
    const key=nit+'|'+cuenta; if(!map[key])map[key]={nit,cuenta,valor:0,debito:0,credito:0,iva:0,ret:0};
    map[key].debito+=Number(a.debito)||0; map[key].credito+=Number(a.credito)||0;
    const val=(Number(a.debito)||0)-(Number(a.credito)||0); map[key].valor+=val;
    if(cuenta.startsWith('24')) map[key].iva+=Math.abs(val);
    if(cuenta.startsWith('236')) map[key].ret+=Math.abs(val);
  }); return Object.values(map);
}
function exogRowsFor(format){
  const rows=exogBaseRows(); const rules=exogRulesFor(format); const out={};
  const add=(nit,concepto,valor,base,ret=0,iva=0,cuenta='')=>{if(!nit)return;const k=nit+'|'+concepto+'|'+cuenta;if(!out[k])out[k]={nit,cuenta,concepto,valor:0,base:0,retencion:0,iva:0};out[k].valor+=valor;out[k].base+=base;out[k].retencion+=ret;out[k].iva+=iva;};
  rows.forEach(r=>{
    const rule=rules.find(x=>String(x.cuenta)===String(r.cuenta));
    if(rule){const abs=Math.abs(r.valor);add(r.nit,rule.concepto,abs,abs,r.ret,r.iva,r.cuenta);return;}
    // Compatibilidad: si aún no hay reglas configuradas, conservar la detección automática anterior.
    if(rules.length) return;
    const abs=Math.abs(r.valor); const c=String(r.cuenta);
    if(format==='1001'&&(c.startsWith('5')||c.startsWith('6')))add(r.nit,'5001',abs,abs,r.ret,0,c);
    else if(format==='1005'&&c.startsWith('2408')&&r.debito>r.credito)add(r.nit,'1',r.iva,r.iva,0,r.iva,c);
    else if(format==='1006'&&c.startsWith('2408')&&r.credito>r.debito)add(r.nit,'1',r.iva,r.iva,0,r.iva,c);
    else if(format==='1007'&&c.startsWith('4'))add(r.nit,'4001',abs,abs,0,0,c);
    else if(format==='1008'&&c.startsWith('13')&&r.debito>r.credito)add(r.nit,'1',abs,abs,0,0,c);
    else if(format==='1009'&&c.startsWith('22')&&r.credito>r.debito)add(r.nit,'1',abs,abs,0,0,c);
    else if(format==='1003'&&c.startsWith('1355')&&r.debito>r.credito)add(r.nit,'1',abs,abs,0,0,c);
  });
  return Object.values(out).filter(x=>Math.abs(x.valor)>0);
}
function renderExogena(){
  const el=document.getElementById('section-exogena'); const cfg=state.exogenaConfig||{anio:new Date().getFullYear(),umbral:24};
  const options=Object.entries(EXOG_FORMATS).map(([k,v])=>`<option value="${k}">${k} — ${v}</option>`).join('');
  const accounts=exogAccounts(); const initial='1001'; const rules=exogRulesFor(initial); const selected=new Set(rules.map(r=>String(r.cuenta)));
  const concepts=(EXOG_CONCEPTS[initial]||[]).map(x=>`<option value="${x[0]}">${x[0]} — ${x[1]}</option>`).join('');
  el.innerHTML=`<div class="section-head"><h1>Información exógena DIAN</h1><p>Configuración por formato y por cuenta contable. Selecciona las cuentas que alimentarán cada formato, asigna el concepto y genera el reporte para revisión y exportación.</p></div>
  <div class="card"><h3>1. Configuración del reporte</h3><div class="grid-4"><div class="field"><label>Año gravable</label><input type="number" id="exogYear" value="${cfg.anio}"></div><div class="field"><label>Umbral operativo (UVT)</label><input type="number" id="exogThreshold" value="${cfg.umbral}"></div><div class="field"><label>Formato DIAN</label><select id="exogFormat">${options}</select></div><div class="field"><label>Concepto para nuevas cuentas</label><select id="exogConcept">${concepts}</select></div></div><div class="btn-row"><button class="btn btn-primary" id="exogGenerate">Generar reporte</button><button class="btn" id="exogExcel">Exportar reporte Excel</button><button class="btn" id="exogExcelAll">Exportar todos los formatos</button></div></div>
  <div class="card"><h3>2. Selección de cuentas contables</h3><p class="empty-note">Marca las cuentas que deben alimentar el formato seleccionado. La asignación queda guardada por formato.</p><div class="toolbar"><input id="exogAccountSearch" placeholder="Buscar cuenta o descripción…"><button class="btn" id="exogSelectAll">Seleccionar todas</button><button class="btn" id="exogClearAll">Limpiar selección</button><button class="btn btn-primary" id="exogSaveRules">Guardar cuentas seleccionadas</button></div><div class="table-scroll"><table class="ledger"><thead><tr><th></th><th>Cuenta</th><th>Descripción</th><th>Concepto</th></tr></thead><tbody id="exogAccountsTable"></tbody></table></div></div>
  <div class="card"><h3>3. Reporte generado</h3><div class="table-scroll"><table class="ledger"><thead><tr><th>NIT</th><th>Tercero</th><th>Cuenta</th><th>Concepto</th><th class="num">Valor</th><th class="num">Base</th><th class="num">Retención</th><th class="num">IVA</th></tr></thead><tbody id="exogTable"></tbody></table></div></div>
  <div class="card"><h3>4. Ajustes manuales</h3><div class="grid-4"><div class="field"><label>Formato</label><select id="adjFormat">${options}</select></div><div class="field"><label>NIT</label><input id="adjNit"></div><div class="field"><label>Concepto</label><input id="adjConcept" value="9999"></div><div class="field"><label>Valor</label><input type="number" step="0.01" id="adjValue"></div></div><div class="btn-row"><button class="btn" id="adjAdd">Agregar ajuste</button></div></div>
  <div class="card"><p class="empty-note"><b>Importante:</b> los conceptos y reglas deben validarse contra la resolución y especificaciones técnicas DIAN del año gravable. Este módulo genera un reporte de trabajo en Excel; no transmite XML ni reemplaza el prevalidador oficial.</p></div>`;
  const renderAccounts=()=>{
    const fmt=document.getElementById('exogFormat').value, q=(document.getElementById('exogAccountSearch').value||'').toLowerCase(); const rs=exogRulesFor(fmt); const sel=new Set(rs.map(r=>String(r.cuenta)));
    document.getElementById('exogConcept').innerHTML=(EXOG_CONCEPTS[fmt]||[]).map(x=>`<option value="${x[0]}">${x[0]} — ${x[1]}</option>`).join('');
    document.getElementById('exogAccountsTable').innerHTML=accounts.filter(a=>(a.code+' '+a.desc).toLowerCase().includes(q)).map(a=>{const rule=rs.find(r=>String(r.cuenta)===a.code);const concept=rule?.concepto||((EXOG_CONCEPTS[fmt]||[])[0]?.[0]||'1');return `<tr><td><input type="checkbox" class="exog-account-check" data-cuenta="${escapeAttr(a.code)}" ${sel.has(a.code)?'checked':''}></td><td class="code">${escapeAttr(a.code)}</td><td>${escapeAttr(a.desc)}</td><td><select class="exog-account-concept" data-cuenta="${escapeAttr(a.code)}" ${sel.has(a.code)?'':'disabled'}>${(EXOG_CONCEPTS[fmt]||[]).map(x=>`<option value="${x[0]}" ${String(concept)===String(x[0])?'selected':''}>${x[0]}</option>`).join('')}</select></td></tr>`}).join('')||'<tr><td colspan="4" class="empty-note">No hay cuentas con movimiento.</td></tr>';
    document.querySelectorAll('.exog-account-check').forEach(ch=>ch.onchange=()=>{const s=ch.closest('tr').querySelector('.exog-account-concept');s.disabled=!ch.checked;});
  };
  const saveRules=()=>{const fmt=document.getElementById('exogFormat').value;state.exogenaReglas=(state.exogenaReglas||[]).filter(r=>r.formato!==fmt);document.querySelectorAll('.exog-account-check:checked').forEach(ch=>{const tr=ch.closest('tr');const cuenta=ch.dataset.cuenta;const concepto=tr.querySelector('.exog-account-concept').value;state.exogenaReglas.push({id:uid(),formato:fmt,cuenta,concepto,activo:true});});scheduleSave();renderAccounts();alert(`Configuración del formato ${fmt} guardada.`);};
  const generate=()=>{saveRules();const f=document.getElementById('exogFormat').value;const rows=exogRowsFor(f);document.getElementById('exogTable').innerHTML=rows.length?rows.map(r=>`<tr><td>${escapeAttr(r.nit)}</td><td>${escapeAttr(getTerceroNombre(r.nit))}</td><td class="code">${escapeAttr(r.cuenta||'')}</td><td>${escapeAttr(r.concepto)}</td><td class="num">${fmtMoney(r.valor)}</td><td class="num">${fmtMoney(r.base)}</td><td class="num">${fmtMoney(r.retencion)}</td><td class="num">${fmtMoney(r.iva)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty-note">No se encontraron movimientos con las cuentas seleccionadas.</td></tr>';};
  document.getElementById('exogYear').oninput=e=>{cfg.anio=Number(e.target.value)||new Date().getFullYear();state.exogenaConfig=cfg;scheduleSave();};
  document.getElementById('exogThreshold').oninput=e=>{cfg.umbral=Number(e.target.value)||24;state.exogenaConfig=cfg;scheduleSave();};
  document.getElementById('exogFormat').onchange=renderAccounts; document.getElementById('exogAccountSearch').oninput=renderAccounts;
  document.getElementById('exogSelectAll').onclick=()=>{document.querySelectorAll('.exog-account-check').forEach(ch=>{ch.checked=true;ch.closest('tr').querySelector('.exog-account-concept').disabled=false;});};
  document.getElementById('exogClearAll').onclick=()=>{document.querySelectorAll('.exog-account-check').forEach(ch=>{ch.checked=false;ch.closest('tr').querySelector('.exog-account-concept').disabled=true;});};
  document.getElementById('exogSaveRules').onclick=saveRules; document.getElementById('exogGenerate').onclick=generate;
  document.getElementById('adjAdd').onclick=()=>{const nit=document.getElementById('adjNit').value.trim(),valor=Number(document.getElementById('adjValue').value)||0;if(!nit||!valor)return alert('NIT y valor son obligatorios.');state.exogenaAjustes.push({id:uid(),formato:document.getElementById('adjFormat').value,nit,concepto:document.getElementById('adjConcept').value.trim()||'9999',valor});scheduleSave();alert('Ajuste guardado.');};
  document.getElementById('exogExcel').onclick=()=>exportExogenaExcel(document.getElementById('exogFormat').value);
  document.getElementById('exogExcelAll').onclick=()=>exportExogenaExcel();
  renderAccounts(); generate();
}
const EXOG_VERSIONS={
  2025:{'1001':'10','1003':'7','1005':'9','1006':'8','1007':'9','1008':'7','1009':'7','1010':'9','1011':'6','1012':'7','1013':'6','2276':'4'},
  2026:{'1001':'11','1003':'7','1005':'9','1006':'8','1007':'9','1008':'7','1009':'7','1010':'9','1011':'6','1012':'7','1013':'6','2276':'4'}
};
function exogVersion(f){const y=Number(state.exogenaConfig?.anio)||new Date().getFullYear();return (EXOG_VERSIONS[y]||EXOG_VERSIONS[y>=2026?2026:2025]||{})[f]||'';}
function exogTerceroData(nit){const t=getTercero(nit)||{};return {tipo:exogDocType(nit),nit:String(nit||''),nombre:t.nombre||'',direccion:t.direccion||'',departamento:t.departamento||'',municipio:t.ciudad||'',pais:t.pais||'Colombia'};}
function exogExcelSchema(f){
  const common=['Tipo de documento','Número de identificación','Razón social / Nombres y apellidos','Dirección','Código departamento','Código municipio','País de residencia o domicilio','Concepto'];
  const schemas={
    '1001':common.concat(['Pago o abono en cuenta deducible','Pago o abono en cuenta no deducible','IVA mayor valor del costo o gasto deducible','IVA mayor valor del costo o gasto no deducible','Retención en la fuente practicada Renta','Retención en la fuente asumida Renta','Retención en la fuente practicada IVA responsables','Retención en la fuente practicada IVA no domiciliados']),
    '1003':common.slice(0,7).concat(['Concepto','Valor base retención','Valor retención practicada']),
    '1005':common.slice(0,3).concat(['Concepto','Impuesto descontable','IVA resultante por devoluciones en ventas anuladas, rescindidas o resueltas']),
    '1006':common.slice(0,3).concat(['Concepto','Impuesto generado','IVA recuperado en devoluciones en compras anuladas, rescindidas o resueltas','Impuesto nacional al consumo']),
    '1007':common.slice(0,3).concat(['Concepto','Ingresos brutos recibidos','Devoluciones, rebajas y descuentos','Ingresos netos']),
    '1008':common.slice(0,3).concat(['Concepto','Saldo cuenta por cobrar a 31 de diciembre']),
    '1009':common.slice(0,3).concat(['Concepto','Saldo cuenta por pagar a 31 de diciembre']),
    '1010':common.slice(0,3).concat(['Concepto','Valor nominal de la acción, aporte o derecho social a diciembre 31','Valor prima en colocación de acciones a diciembre 31','Valor pagado durante el año por prima en colocación']),
    '1011':common.slice(0,3).concat(['Concepto','Valor patrimonial / valor solicitado en declaración']),
    '1012':common.slice(0,3).concat(['Concepto','Valor patrimonial de la inversión a 31 de diciembre']),
    '1013':common.slice(0,3).concat(['Concepto','Saldo a 31 de diciembre']),
    '2276':common.slice(0,3).concat(['Concepto','Pagos por honorarios','Pagos por servicios','Pagos por salarios','Pagos por viáticos','Otros pagos','Valor retenciones en la fuente'])
  };return schemas[f]||common.concat(['Valor','Base','Retención','IVA']);
}
function exogExcelRows(f){
  const rows=exogRowsFor(f), out=[];
  rows.forEach(r=>{const t=exogTerceroData(r.nit), c=String(r.concepto||'');
    let vals;
    if(f==='1001') vals=[t.tipo,t.nit,t.nombre,t.direccion,'','',t.pais,c,Math.round(Math.max(0,r.valor)),0,0,0,Math.round(r.retencion||0),0,0,0];
    else if(f==='1003') vals=[t.tipo,t.nit,t.nombre,t.direccion,'','',t.pais,c,Math.round(r.base||0),Math.round(r.retencion||0)];
    else if(f==='1005') vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.iva||r.valor||0),0];
    else if(f==='1006') vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.iva||r.valor||0),0,0];
    else if(f==='1007') vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.valor||0),0,Math.round(r.valor||0)];
    else if(f==='1008') vals=[t.tipo,t.nit,t.nombre,c,Math.round(Math.max(0,r.valor||0))];
    else if(f==='1009') vals=[t.tipo,t.nit,t.nombre,c,Math.round(Math.max(0,r.valor||0))];
    else if(f==='1010') vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.valor||0),0,0];
    else if(f==='1011') vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.valor||0)];
    else if(f==='1012') vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.valor||0)];
    else if(f==='1013') vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.valor||0)];
    else if(f==='2276') vals=[t.tipo,t.nit,t.nombre,c,0,0,Math.round(r.valor||0),0,0,0];
    else vals=[t.tipo,t.nit,t.nombre,c,Math.round(r.valor||0),Math.round(r.base||0),Math.round(r.retencion||0),Math.round(r.iva||0)];
    out.push(vals);
  });
  return out;
}
function exportExogenaExcel(formato){
  if(typeof XLSX==='undefined')return alert('Motor Excel no disponible.');
  const wb=XLSX.utils.book_new(), y=state.exogenaConfig?.anio||new Date().getFullYear();
  const formats=formato?[formato]:Object.keys(EXOG_FORMATS);
  formats.forEach(f=>{
    const headers=exogExcelSchema(f), rows=exogExcelRows(f), ver=exogVersion(f);
    const meta=[['AÑO GRAVABLE',y],['FORMATO',f],['VERSIÓN',ver],['NOMBRE DEL FORMATO',EXOG_FORMATS[f]],['CUENTAS CONTABLES SELECCIONADAS',exogRulesFor(f).map(r=>r.cuenta).join(', ')||'DETECCIÓN AUTOMÁTICA'],[]];
    const ws=XLSX.utils.aoa_to_sheet(meta.concat([headers]).concat(rows));
    const control=[['FORMATO',f],['VERSIÓN',ver],['AÑO GRAVABLE',y],['CUENTA','DESCRIPCIÓN','CONCEPTO','ACTIVA']];
    exogRulesFor(f).forEach(rule=>control.push([rule.cuenta,getAccountDesc(rule.cuenta),rule.concepto,rule.activo!==false?'SI':'NO']));
    const wsc=XLSX.utils.aoa_to_sheet(control);
    wsc['!cols']=[{wch:14},{wch:42},{wch:14},{wch:12}];
    XLSX.utils.book_append_sheet(wb,wsc,`Control ${f}`.slice(0,31));
    ws['!freeze']={xSplit:0,ySplit:6};
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:6,c:0},e:{r:6+rows.length,c:headers.length-1}})};
    ws['!cols']=headers.map(h=>({wch:Math.min(42,Math.max(14,h.length+2))}));
    XLSX.utils.book_append_sheet(wb,ws,`${f} v${ver||''}`.slice(0,31));
  });
  XLSX.writeFile(wb,`informacion-exogena-${y}${formato?'-'+formato:''}.xlsx`);
}

function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    alert('No se pudo cargar el motor de Excel. Verifica tu conexión a internet.');
    return;
  }
  const wb = XLSX.utils.book_new();

  const asientosAOA = [
    ['Prefijo','Documento','Número','Fecha','Descripción','Observación','NIT','Tercero','Cuenta','Detalle','Débito','Crédito'],
    ...state.asientos.map(a => [a.prefijo, a.documento, a.numero, a.fecha, a.descripcion, a.observacion, a.nit, getTerceroNombre(a.nit), a.cuenta, a.detalle, a.debito, a.credito])
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(asientosAOA), 'Asientos');

  const mayor = accountsWithMovement();
  const mayorAOA = [['Cuenta','Descripción','Debe','Haber','Saldo'], ...mayor.map(a => [a.code, a.desc, a.debito, a.credito, a.saldo])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mayorAOA), 'Balance Comprobacion');

  const esf = computeESF();
  const esfAOA = [['Cuenta','Descripción','Saldo']];
  esf.activo.forEach(a => esfAOA.push([a.code, a.desc, a.debito - a.credito]));
  esfAOA.push(['','TOTAL ACTIVO', esf.totalActivo]);
  esf.pasivo.forEach(a => esfAOA.push([a.code, a.desc, a.credito - a.debito]));
  esfAOA.push(['','TOTAL PASIVO', esf.totalPasivo]);
  esf.patrimonio.forEach(a => esfAOA.push([a.code, a.desc, a.credito - a.debito]));
  esfAOA.push(['','Utilidad del ejercicio', esf.utilidadEjercicio]);
  esfAOA.push(['','TOTAL PATRIMONIO', esf.totalPatrimonio]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(esfAOA), 'ESF');

  const er = computeER();
  const erAOA = [['Cuenta','Descripción','Valor']];
  er.ingresosOperacionales.concat(er.ingresosNoOperacionales).forEach(a => erAOA.push([a.code, a.desc, a.credito - a.debito]));
  erAOA.push(['','TOTAL INGRESOS', er.totalIngresos]);
  er.costos.forEach(a => erAOA.push([a.code, a.desc, a.debito - a.credito]));
  erAOA.push(['','UTILIDAD BRUTA', er.utilidadBruta]);
  er.gastosAdmon.concat(er.gastosVentas).forEach(a => erAOA.push([a.code, a.desc, a.debito - a.credito]));
  erAOA.push(['','UTILIDAD OPERACIONAL', er.utilidadOperacional]);
  erAOA.push(['','UTILIDAD NETA', er.utilidadNeta]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(erAOA), 'ER');

  const nombreArchivo = (state.empresa.nombre || 'empresa').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  XLSX.writeFile(wb, `libro-contable-${nombreArchivo}-${todayStamp()}.xlsx`);
}

   MAYÚSCULAS AUTOMÁTICAS EN REGISTROS
--------------------------------------------------------- */
function shouldUppercaseInput(el){ if(!el||!['INPUT','TEXTAREA','SELECT'].includes(el.tagName))return false; const t=(el.type||'').toLowerCase(); if(['email','password','date','number','file','color','range','checkbox','radio'].includes(t))return false; if(el.dataset.keepcase==='true')return false; return true; }
document.addEventListener('input',e=>{if(shouldUppercaseInput(e.target)&&typeof e.target.value==='string'){const p=e.target.selectionStart; e.target.value=e.target.value.toUpperCase(); try{e.target.setSelectionRange(p,p);}catch(_){}}});
function uppercaseBusinessState(s){
 const skipKeys = new Set(['correo','email','passwordHash','dataUrl','logoDataUrl','firmaRepresentanteDataUrl','firmaContadorDataUrl','firmaRevisorDataUrl','rutText','_lastExtracted']);
 const skipSubtrees = new Set(['emailConfig','emailHistory','driveConfig']); // configuración técnica: nunca se toca
 const walk=(obj)=>{
   if(!obj||typeof obj!=='object')return;
   Object.keys(obj).forEach(k=>{
     if(skipSubtrees.has(k)) return; // no entrar aquí en absoluto, ni para leer ni para modificar
     const v=obj[k];
     if(typeof v==='string' && !skipKeys.has(k) && !k.toLowerCase().includes('url')) obj[k]=v.toUpperCase();
     else if(v && typeof v==='object') walk(v);
   });
 };
 walk(s);
 return s;
}
