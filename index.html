  document.getElementById('gateCreateNombre').focus();
});
document.getElementById('gateLoginBack').addEventListener('click', () => showGateStep('gateChoice'));
document.getElementById('gateCreateBack').addEventListener('click', () => showGateStep('gateChoice'));

document.getElementById('gateLoginSubmit').addEventListener('click', async () => {
  const username = document.getElementById('gateLoginUser').value.trim();
  const password = document.getElementById('gateLoginPass').value;
  if(!username || !password){ showGateError('Escribe usuario y contraseña.'); return; }
  const idx = loadUserIndex();
  const match = idx.find(u => u.username.toLowerCase() === username.toLowerCase());
  if(!match){ showGateError('No existe ningún usuario con ese nombre.'); return; }
  const hash = await sha256(password);
  if(hash !== match.passwordHash){ showGateError('Contraseña incorrecta.'); return; }
  await enterCompany(match.companyId, { role: match.role, username: match.username });
});

document.getElementById('gateCreateSubmit').addEventListener('click', async () => {
  const nombre = document.getElementById('gateCreateNombre').value.trim();
  const username = document.getElementById('gateCreateUser').value.trim();
  const password = document.getElementById('gateCreatePass').value;
  const password2 = document.getElementById('gateCreatePass2').value;
  if(!nombre){ showGateError('Escribe el nombre de la empresa.'); return; }
  if(!username){ showGateError('Escribe un usuario.'); return; }
  if(password.length < 4){ showGateError('La contraseña debe tener al menos 4 caracteres.'); return; }
  if(password !== password2){ showGateError('Las contraseñas no coinciden.'); return; }
  const existingIdx = loadUserIndex();
  if(existingIdx.some(u => u.username.toLowerCase() === username.toLowerCase())){ showGateError('Ese usuario ya existe, elige otro.'); return; }

  const id = uid();
  const passwordHash = await sha256(password);
  companies.push({ id, nombre });
  saveCompaniesDirectory();
  const newState = blankCompanyState(nombre);
  newState.users = [{ id: uid(), username, passwordHash, role: 'administrador' }];
  try{ localStorage.setItem(companyDataKey(id), JSON.stringify(newState)); }
  catch(e){ console.error(e); }
  addUserToIndex(username, id, passwordHash, 'administrador');

  await enterCompany(id, { role: 'administrador', username, goToEmpresa: true });
});

// Enter con foco en los campos de la pantalla de acceso
['gateLoginUser','gateLoginPass'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('gateLoginSubmit').click(); });
});
['gateCreateNombre','gateCreateUser','gateCreatePass','gateCreatePass2'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('gateCreateSubmit').click(); });
});

async function enterCompany(id, opts){
  opts = opts || {};
  activeCompanyId = id;
  currentUser = { username: opts.username || '', role: opts.role || 'administrador' };
  await loadCompanyState(id);
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  // Limpiar campos sensibles del formulario de acceso
  ['gateLoginUser','gateLoginPass','gateCreateNombre','gateCreateUser','gateCreatePass','gateCreatePass2'].forEach(fid => {
    document.getElementById(fid).value = '';
  });
  applyAccentColor();
  applyDarkMode();
  updateSidebarBrand();
  renderNav();
  logAudit('Inicio de sesión', '');
  scheduleSave();
  checkVencimientosNotificaciones();
  switchSection(opts.goToEmpresa ? 'empresa' : 'inicio');
  if(opts.goToEmpresa){
    setTimeout(() => alert('Empresa creada. Eres el administrador. Ahora puedes cargar el RUT (PDF) para completar los datos automáticamente, o llenarlos a mano — recuerda que NIT, razón social, tipo de contribuyente, correo y teléfono son obligatorios.'), 150);
  }
}

function logout(){
  activeCompanyId = null;
  state = null;
  currentUser = null;
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('gateScreen').style.display = 'flex';
  showGateStep('gateChoice');
  renderGateCompaniesHint();
}

document.getElementById('btnLogout').addEventListener('click', () => {
  if(!confirm('¿Cerrar esta empresa y volver a la pantalla de acceso? Tus datos quedan guardados.')) return;
  logout();
});

/* ---------------------------------------------------------
   PWA / APLICACIÓN MÓVIL
--------------------------------------------------------- */
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
function showInstallButton(){
  const host=document.querySelector('.save-status'); if(!host||document.getElementById('btnInstallPWA'))return;
  const b=document.createElement('button'); b.id='btnInstallPWA'; b.className='btn mobile-install'; b.textContent='Instalar app'; b.style.marginLeft='8px';
  b.onclick=async()=>{
    if(!deferredInstallPrompt){
      alert('Para instalar la app en tu celular:\n\niPhone/iPad (Safari): toca Compartir (el ícono del cuadrado con flecha) → "Añadir a pantalla de inicio".\n\nAndroid (Chrome): toca el menú (⋮) → "Instalar aplicación" o "Añadir a pantalla de inicio".\n\nSi no ves esa opción, es porque este archivo se abrió directamente desde el celular (file://) — para que el instalador automático de Android funcione, sube este archivo a un hosting como GitHub Pages o Netlify y ábrelo desde esa dirección web (https://).');
      return;
    }
    deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt=null; b.remove();
  };
  host.appendChild(b);
}
window.addEventListener('load',()=>{
  showInstallButton();
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{
      // No pasa nada si no existe sw.js junto al archivo — la app sigue funcionando normalmente,
      // solo no tendrá caché para uso sin conexión ni el instalador automático de Android.
    });
  }
});
</script>
