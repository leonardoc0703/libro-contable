<style>
  :root{
    --paper: #F6F4EE;
    --surface: #FFFFFF;
    --surface-alt: #EFEBE0;
    --ink: #1C2B39;
    --ink-soft: #64727E;
    --rule: #D6D0C0;
    --rule-soft: #E5E1D4;
    --accent: #7A2E3D;
    --accent-dark: #5C2130;
    --debit: #2B4C6F;
    --credit: #7A2E3D;
    --good: #2F6845;
    --bad: #B23A2E;
    --sidebar-bg: #16232F;
    --sidebar-ink: #E8E4D9;
    --sidebar-ink-soft: #8FA0AC;
    --sidebar-active: #24384A;
  }

  html.dark-mode{
    --paper: #131D27;
    --surface: #1B2733;
    --surface-alt: #223140;
    --ink: #E8E4D9;
    --ink-soft: #9BAAB5;
    --rule: #33454F;
    --rule-soft: #293944;
    --sidebar-bg: #0C141C;
    --sidebar-active: #1B2733;
  }
  html.dark-mode img{ opacity: 0.92; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    transition: background 0.15s, color 0.15s;
  }
  .app-shell{
    display: flex;
    min-height: 100vh;
  }

  ::selection{ background: rgba(122,46,61,0.18); }

  /* ---------- Pantalla de acceso ---------- */
  .gate-screen{
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--sidebar-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .gate-card{
    background: var(--surface);
    border-radius: 6px;
    padding: 36px 34px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .gate-card h1{
    font-size: 1.5rem;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .gate-sub{
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 0 0 26px;
    line-height: 1.4;
  }
  .gate-card h3{
    font-size: 1rem;
    margin-bottom: 16px;
  }
  .gate-step .field{ margin-bottom: 14px; }
  .gate-big-btn{
    display: block;
    width: 100%;
    text-align: center;
    padding: 13px 16px;
    margin-bottom: 10px;
    font-size: 0.88rem;
  }
  .gate-hint{
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 16px;
    line-height: 1.4;
  }
  .gate-error{
    font-size: 0.82rem;
    color: var(--bad);
    margin-top: 14px;
    min-height: 1.2em;
  }
  .btn-logout{
    width: 100%;
    margin-top: 10px;
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--sidebar-ink-soft);
    padding: 7px 10px;
    border-radius: 3px;
    font-size: 0.75rem;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .btn-logout:hover{ color: #fff; border-color: rgba(255,255,255,0.35); }

  /* ---------- Modal genérico (terceros, documentos, filtros) ---------- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(28,43,57,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay[hidden]{ display: none; }
  .modal-card{
    background: var(--surface);
    border-radius: 6px;
    padding: 26px 28px;
    max-width: 560px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .modal-card.modal-wide{ max-width: 820px; }
  .modal-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-head h3{ font-size: 1.05rem; margin: 0; }
  .modal-x{
    background: none; border: none; cursor: pointer;
    font-size: 1.3rem; color: var(--ink-soft); line-height: 1;
  }
  .modal-x:hover{ color: var(--bad); }

  .tag-tipo{
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .tag-proveedor{ background: rgba(43,76,111,0.12); color: var(--debit); }
  .tag-cliente{ background: rgba(47,104,69,0.12); color: var(--good); }
  .tag-ambos{ background: rgba(122,46,61,0.12); color: var(--accent); }

  .accent-swatch{
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    cursor: pointer;
    padding: 0;
  }
  .accent-swatch:hover{ border-color: var(--ink); }
  #accentColorPicker{
    width: 40px; height: 32px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2px;
    cursor: pointer;
    background: none;
  }


  h1, h2, h3{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    margin: 0;
  }

  .mono{ font-family: 'IBM Plex Mono', monospace; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 240px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-ink);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-brand{
    padding: 22px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-brand .company-name{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.25;
  }
  .sidebar-brand .company-nit{
    font-size: 0.72rem;
    color: var(--sidebar-ink-soft);
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .nav-list{
    list-style: none;
    margin: 0;
    padding: 10px 0;
    flex: 1;
  }
  .nav-item{
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--sidebar-ink-soft);
    padding: 10px 20px;
    font-size: 0.86rem;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .nav-item:hover{ color: var(--sidebar-ink); background: rgba(255,255,255,0.04); }
  .nav-item.active{
    color: #fff;
    background: var(--sidebar-active);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .nav-section-label{
    padding: 14px 20px 4px;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: rgba(143,160,172,0.65);
  }
  .sidebar-footer{
    padding: 14px 20px 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 0.75rem;
  }
  .balance-check{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .balance-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    flex-shrink: 0;
  }
  .balance-dot.bad{ background: var(--bad); }
  .balance-check-text{ color: var(--sidebar-ink-soft); line-height: 1.35; }

  /* ---------- Main content ---------- */
  .main{
    flex: 1;
    min-width: 0;
    padding: 32px 40px 60px;
    max-width: 1180px;
  }
  .section{ display: none; }
  .section.active{ display: block; }

  .section-head{
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }
  .section-head h1{ font-size: 1.6rem; }
  .section-head p{
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 0.88rem;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h3{ font-size: 1rem; margin-bottom: 12px; }

  /* Stat grid (Inicio) */
  .stat-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--ink);
    border: 1px solid var(--ink);
    margin-bottom: 22px;
  }
  .stat-box{ background: var(--surface); padding: 16px 18px; }
  .stat-box .label{ font-size: 0.72rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .stat-box .value{ font-family: 'IBM Plex Mono', monospace; font-size: 1.3rem; font-weight: 600; }
  .stat-box .value.bad{ color: var(--bad); }
  .stat-box .value.good{ color: var(--good); }
  @media (max-width: 900px){ .stat-grid{ grid-template-columns: repeat(2,1fr); } }

  .quick-links{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  @media (max-width: 900px){ .quick-links{ grid-template-columns: repeat(2,1fr); } }
  .quick-link-btn{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 16px 10px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
  }
  .quick-link-btn:hover{ border-color: var(--accent); color: var(--accent-dark); background: rgba(122,46,61,0.04); }
  .quick-link-icon{ font-size: 1.4rem; }

  .charts-row{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 22px;
  }
  @media (max-width: 900px){ .charts-row{ grid-template-columns: 1fr; } }
  .chart-box{ position: relative; height: 280px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; }

  /* Forms */
  .form-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 20px;
  }
  @media (max-width: 700px){ .form-grid{ grid-template-columns: 1fr; } }
  .field{ display: flex; flex-direction: column; gap: 4px; }
  .field label{ font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); font-weight: 600; }
  .field input, .field select, .field textarea{
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 8px 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.88rem;
    color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline: none; border-color: var(--accent); }

  /* Buttons */
  .btn{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.84rem;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 3px;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover{ border-color: var(--accent); color: var(--accent-dark); }
  .btn-primary{ background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover{ background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .btn-sm{ padding: 5px 10px; font-size: 0.76rem; }
  .btn-row{ display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Ledger tables */
  .table-scroll{ overflow-x: auto; }
  .ledger{ width: 100%; min-width: 640px; border-collapse: collapse; font-size: 0.85rem; }
  .ledger th{
    text-align: left;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--ink);
    white-space: nowrap;
  }
  .ledger td{
    padding: 7px 10px;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: middle;
  }
  .ledger tbody tr:hover{ background: var(--surface-alt); }
  .ledger .num{ text-align: right; font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  .ledger .code{ font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  .ledger tfoot td{ font-weight: 700; border-top: 2px solid var(--ink); border-bottom: none; }
  .ledger input, .ledger select{
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    font-family: inherit;
    font-size: inherit;
    color: var(--ink);
    padding: 3px 2px;
  }
  .ledger input:focus, .ledger select:focus{ outline: none; border-bottom-color: var(--accent); background: rgba(122,46,61,0.05); }
  .ledger input.num-input{ text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .ledger .class-row td{
    background: var(--surface-alt);
    font-weight: 700;
    border-bottom: 1px solid var(--rule);
  }
  .ledger .subtotal-row td{
    font-weight: 700;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--rule-soft);
  }
  .row-del{ background:none; border:none; cursor:pointer; color: var(--rule); font-size: 0.95rem; }
  .row-del:hover{ color: var(--bad); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom: 16px; }
  .toolbar input[type="text"], .toolbar input[type="search"], .toolbar select, .toolbar input[type="date"]{
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 0.85rem;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .diff-banner{
    display:flex; align-items:center; gap:10px;
    padding: 10px 16px; border-radius: 4px; font-size: 0.85rem; font-weight: 600;
    margin-bottom: 14px;
  }
  .diff-banner.ok{ background: rgba(47,104,69,0.1); color: var(--good); border: 1px solid var(--good); }
  .diff-banner.bad{ background: rgba(178,58,46,0.08); color: var(--bad); border: 1px solid var(--bad); }

  .empty-note{ font-size: 0.85rem; color: var(--ink-soft); padding: 14px 0; }

  /* ---------- RUT: extracción, imagen y buscador ---------- */
  .rut-extracted{
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(47,104,69,0.06);
    border: 1px solid var(--good);
    border-radius: 4px;
  }
  .rut-extracted h4{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 0.92rem;
    margin: 0 0 8px;
    color: var(--good);
  }
  .rut-extracted ul{ margin: 0; padding-left: 18px; font-size: 0.83rem; }
  .rut-extracted li{ margin-bottom: 3px; }
  .rut-extracted .field-name{ color: var(--ink-soft); }

  .rut-image-wrap{ margin-top: 18px; }
  .rut-image-wrap h4{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 0.92rem;
    margin: 0 0 10px;
  }
  .rut-image-wrap img{
    max-width: 100%;
    border: 1px solid var(--rule);
    border-radius: 4px;
    display: block;
  }

  .rut-search-wrap{ margin-top: 18px; }
  .rut-search-wrap h4{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 0.92rem;
    margin: 0 0 8px;
  }
  .rut-search-wrap input{
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 0.85rem;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .rut-search-results{
    margin-top: 10px;
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--rule-soft);
    border-radius: 3px;
  }
  .rut-search-result{
    padding: 7px 10px;
    font-size: 0.82rem;
    border-bottom: 1px solid var(--rule-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .rut-search-result:last-child{ border-bottom: none; }
  .rut-search-result mark{ background: rgba(122,46,61,0.18); color: var(--accent-dark); padding: 0 1px; }

  .save-status{
    font-size: 0.75rem; color: var(--ink-soft);
    display:flex; align-items:center; gap:6px;
    position: absolute; top: 20px; right: 40px;
  }
  .save-dot{ width:7px; height:7px; border-radius:50%; background: var(--good); }
  .save-dot.saving{ background: var(--accent); }

  @media (max-width: 900px){
    body{ flex-direction: column; }
    .sidebar{ width: 100%; height: auto; position: relative; }
    .main{ padding: 24px 18px 60px; }
    .save-status{ position: static; margin-bottom: 10px; }
  }

  /* ---------- Móvil / PWA ---------- */
  .mobile-install{ display:none; }
  .mobile-only{ display:none; }
  @media (max-width: 900px){
    .app-shell{ display:block; }
    .sidebar{ position:sticky; top:0; z-index:120; width:100%; height:auto; min-height:0; display:flex; flex-direction:column; }
    .sidebar-brand{ padding:10px 14px; }
    .sidebar .nav-list{ display:flex; overflow-x:auto; gap:4px; padding:6px 8px 8px; white-space:nowrap; scrollbar-width:none; }
    .sidebar .nav-list::-webkit-scrollbar{ display:none; }
    .sidebar .nav-section-label{ display:none; }
    .sidebar .nav-item{ padding:8px 11px; font-size:.76rem; border-radius:18px; }
    .sidebar-footer{ display:none; }
    .main{ width:100%; padding:14px; }
    .section-head h1{ font-size:1.25rem; }
    .toolbar{ flex-wrap:wrap; }
    .toolbar > *{ max-width:100%; }
    .card{ padding:16px; }
    .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table.ledger{ min-width:720px; }
    input, select, textarea, button{ font-size:16px; }
    .mobile-install{ display:inline-flex; }
  }
  @media (max-width: 560px){
    .main{ padding:10px; }
    .btn-row{ flex-direction:column; align-items:stretch; }
    .btn-row .btn{ width:100%; }
    .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr !important; }
    .stat-grid{ grid-template-columns:1fr 1fr !important; }
  }

</style>
</head>
<body>

<div id="gateScreen" class="gate-screen">
  <div class="gate-card">
    <h1>Libro Contable</h1>
    <p class="gate-sub">Software contable multiempresa — partida doble, terceros, informes financieros.</p>

function uid(){ return Math.random().toString(36).slice(2, 10); }

function fmtMoney(n){
  n = Number(n) || 0;
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.round(Math.abs(n)).toLocaleString('es-CO');
}

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  if(!y || !m || !d) return iso;
  return `${d}/${m}/${y}`;
}

function todayISO(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function printReport(titulo, contentHTML){
  const win = window.open('', '_blank');
  if(!win){ alert('Tu navegador bloqueó la ventana de impresión. Permite ventanas emergentes para este sitio e inténtalo de nuevo.'); return; }
  const e = state.empresa;
  const rc = state.reportConfig || { firmarRepresentante:true, firmarContador:true, firmarRevisor:false };
  const logoImg = e.logoDataUrl ? `<img src="${e.logoDataUrl}" style="max-height:80px;max-width:220px;object-fit:contain;margin-bottom:8px;">` : '';
  const firmas = [
    rc.firmarRepresentante ? `<div class="firma">${e.firmaRepresentanteDataUrl ? `<img src="${e.firmaRepresentanteDataUrl}" class="firma-img">` : ''}<strong>${escapeAttr(e.representanteLegal || '_______________________')}</strong><br>Representante legal</div>` : '',
    rc.firmarContador ? `<div class="firma">${e.firmaContadorDataUrl ? `<img src="${e.firmaContadorDataUrl}" class="firma-img">` : ''}<strong>${escapeAttr(e.contador || '_______________________')}</strong><br>Contador${e.contadorTP ? ' · T.P. ' + escapeAttr(e.contadorTP) : ''}</div>` : '',
    rc.firmarRevisor ? `<div class="firma">${e.firmaRevisorDataUrl ? `<img src="${e.firmaRevisorDataUrl}" class="firma-img">` : ''}<strong>${escapeAttr(e.revisorFiscal || '_______________________')}</strong><br>Revisor fiscal${e.revisorTP ? ' · T.P. ' + escapeAttr(e.revisorTP) : ''}</div>` : ''
  ].filter(Boolean).join('');
  win.document.write(`
    <!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo} — ${escapeAttr(e.nombre||'')}</title>
    <style>
      body{ font-family: Arial, Helvetica, sans-serif; color:#1C2B39; padding: 30px 40px; }
      h1{ font-family: Georgia, serif; font-size:1.5rem; margin:0 0 4px; }
      .meta{ font-size:0.85rem; color:#555; margin-bottom:22px; border-bottom:2px solid #1C2B39; padding-bottom:12px; }
      h3{ font-size:1rem; margin: 18px 0 8px; }
      .card{ margin-bottom: 18px; }
      table.ledger{ width:100%; border-collapse:collapse; font-size:0.85rem; margin-bottom: 6px; }
      table.ledger th, table.ledger td{ padding:5px 8px; border-bottom:1px solid #ddd; text-align:left; }
      .num{ text-align:right; }
      table.ledger tfoot td{ font-weight:700; border-top:2px solid #1C2B39; border-bottom:none; }
      .class-row td{ background:#f3f1ea; font-weight:700; }
      .subtotal-row td{ font-weight:700; border-top:1px solid #1C2B39; }
      .code{ font-family: 'Courier New', monospace; }
      .diff-banner{ padding:10px 14px; margin-bottom:16px; border-radius:4px; font-weight:600; font-size:0.85rem; }
      .diff-banner.ok{ background:#eef7f0; color:#2F6845; }
      .diff-banner.bad{ background:#fbeceb; color:#B23A2E; }
      .empty-note{ color:#777; font-size:0.85rem; }
      .firmas{ display:flex; justify-content:space-between; margin-top:70px; gap:20px; }
      .firma{ text-align:center; flex:1; border-top:1px solid #1C2B39; padding-top:6px; font-size:0.78rem; min-height:75px; }
      .firma-img{ display:block; max-width:170px; max-height:55px; margin:0 auto 5px; object-fit:contain; }
      @media print{ body{ padding: 10mm; } }
    </style>
    </head><body>
    <div style="text-align:center;">${logoImg}</div><h1 style="text-align:center;">${escapeAttr(e.nombre || 'Empresa')}</h1>
    <div class="meta">
      NIT ${escapeAttr(e.nit || '')}${e.dv ? '-' + escapeAttr(e.dv) : ''} ·
      ${titulo} ·
      Generado el ${new Date().toLocaleString('es-CO')}
    </div>
    ${contentHTML}
    ${firmas ? `<div class="firmas">${firmas}</div>` : ''}
    </body></html>
  `);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 350);
}

function todayStamp(){
  return todayISO();
}

function escapeAttr(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  if(!s.empresa) s.empresa = { ...EMPRESA_DEFAULTS };
  // Compatibilidad con versiones anteriores del formulario
  if(s.empresa.ciiuPrincipal && (!Array.isArray(s.empresa.actividades) || !s.empresa.actividades.length)){
    s.empresa.actividades = [{ codigo: s.empresa.ciiuPrincipal, descripcion: '', principal: true }];
    if(s.empresa.ciiuSecundaria) s.empresa.actividades.push({ codigo: s.empresa.ciiuSecundaria, descripcion: '', principal: false });
  }
  if(s.empresa.responsabilidades && (!Array.isArray(s.empresa.responsabilidadesList) || !s.empresa.responsabilidadesList.length)){
    s.empresa.responsabilidadesList = String(s.empresa.responsabilidades).split('·').map(t => t.trim()).filter(Boolean).map(t => ({ codigo: '', descripcion: t }));
  }
  if(s.empresa.regimen === undefined && s.empresa.responsabilidades) s.empresa.regimen = s.empresa.responsabilidades;
  if(s.empresa.rutImageDataUrl && (!Array.isArray(s.empresa.rutImages) || !s.empresa.rutImages.length)){
    s.empresa.rutImages = [s.empresa.rutImageDataUrl];
  }
  Object.keys(EMPRESA_DEFAULTS).forEach(key => {
    if(typeof s.empresa[key] === 'undefined') s.empresa[key] = Array.isArray(EMPRESA_DEFAULTS[key]) ? [] : EMPRESA_DEFAULTS[key];
  });
  if(!Array.isArray(s.empresa.actividades)) s.empresa.actividades = [];
  s.empresa.regimen = ''; // Campo retirado de la ficha de empresa.
  if(!Array.isArray(s.empresa.responsabilidadesList)) s.empresa.responsabilidadesList = [];
  if(!Array.isArray(s.empresa.rutImages)) s.empresa.rutImages = [];
  if(typeof s.empresa.rutText !== 'string') s.empresa.rutText = '';
  if(!s.empresa.emailConfig || typeof s.empresa.emailConfig !== 'object') s.empresa.emailConfig = { ...EMPRESA_DEFAULTS.emailConfig };
  Object.keys(EMPRESA_DEFAULTS.emailConfig).forEach(key => { if(typeof s.empresa.emailConfig[key] === 'undefined') s.empresa.emailConfig[key] = EMPRESA_DEFAULTS.emailConfig[key]; });
  if(!Array.isArray(s.empresa.emailHistory)) s.empresa.emailHistory = [];
  if(!s.empresa.driveConfig || typeof s.empresa.driveConfig !== 'object') s.empresa.driveConfig = { ...EMPRESA_DEFAULTS.driveConfig };
  Object.keys(EMPRESA_DEFAULTS.driveConfig).forEach(key => { if(typeof s.empresa.driveConfig[key] === 'undefined') s.empresa.driveConfig[key] = EMPRESA_DEFAULTS.driveConfig[key]; });
  if(!Array.isArray(s.puc)) s.puc = SEED_DATA.puc.map(a => ({ ...a }));
  if(!Array.isArray(s.terceros)) s.terceros = [];
  s.terceros.forEach(t => { if(!t.tipo) t.tipo = 'ambos'; });
  if(!Array.isArray(s.tiposDoc)) s.tiposDoc = [];
  if(!Array.isArray(s.asientos)) s.asientos = [];
  s.asientos.forEach(a => { if(!a.id) a.id = uid(); });
  if(!Array.isArray(s.users)) s.users = [];
  if(!Array.isArray(s.auditLog)) s.auditLog = [];
  if(!Array.isArray(s.calendario)) s.calendario = [];
  if(!Array.isArray(s.presupuesto)) s.presupuesto = [];
  if(!Array.isArray(s.conciliacion)) s.conciliacion = [];
  if(!Array.isArray(s.periodosCerrados)) s.periodosCerrados = [];
  if(!Array.isArray(s.centrosCosto)) s.centrosCosto = [];
  if(!Array.isArray(s.subCentrosCosto)) s.subCentrosCosto = [];
  if(!Array.isArray(s.localizaciones)) s.localizaciones = [];
  if(!s.reportConfig) s.reportConfig = { firmarRepresentante: true, firmarContador: true, firmarRevisor: false, comparativo: false, periodoComparativoDesde: '', periodoComparativoHasta: '' };
  if(!Array.isArray(s.divipola)) s.divipola = [];
  if(!Array.isArray(s.ciiuCatalog)) s.ciiuCatalog = [];
  if(!s.calendarConfig) s.calendarConfig = { anio: new Date().getFullYear(), ultimaActualizacion: '' };
  if(!Array.isArray(s.activosFijos)) s.activosFijos = [];
  if(!Array.isArray(s.productos)) s.productos = [];
  if(!Array.isArray(s.movInventario)) s.movInventario = [];
  if(!Array.isArray(s.empleados)) s.empleados = [];
  if(!Array.isArray(s.nomina)) s.nomina = [];
  if(!Array.isArray(s.exogenaReglas)) s.exogenaReglas = [];
  s.exogenaReglas = s.exogenaReglas.map(r=>({id:r.id||uid(),formato:r.formato||'1001',cuenta:String(r.cuenta||''),concepto:String(r.concepto||'5001'),activo:r.activo!==false}));
  if(!s.exogenaConfig) s.exogenaConfig = { anio: new Date().getFullYear(), umbral: 24 };
  if(!Array.isArray(s.exogenaAjustes)) s.exogenaAjustes = [];
  s.asientos.forEach(a => { if(typeof a.centroCosto === 'undefined') a.centroCosto = ''; if(typeof a.subCentroCosto==='undefined') a.subCentroCosto=''; if(typeof a.localizacion==='undefined') a.localizacion=''; });
  if(!s.settings) s.settings = {};

  if(typeof s.settings.darkMode === 'undefined') s.settings.darkMode = false;

function canEdit(section){
  if(!currentUser) return false;
  const role = currentUser.role;
  if(role === 'administrador') return true;
  if(role === 'revisor') return false;
  if(role === 'contador') return section !== 'usuarios';
  if(role === 'auxiliar') return section === 'terceros' || section === 'asientos';
  return false;
}

function canViewSection(sectionId){
  if(!currentUser) return false;
  if(sectionId === 'usuarios') return currentUser.role === 'administrador';
  if(sectionId === 'auditoria') return currentUser.role === 'administrador' || currentUser.role === 'revisor';
  if(currentUser.role === 'auxiliar' && ['empresa','puc','tiposdoc','respaldo'].includes(sectionId)) return false;
  return true;
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

}

// Después de importar un respaldo (.json) o restaurar desde Drive, los usuarios que
// venían dentro de ese respaldo no existen todavía en el índice global de acceso de
// ESTE navegador/origen. Esta función los registra ahí, asociados a la empresa activa,
// para que puedas volver a iniciar sesión con tu usuario y contraseña de siempre.
function reconciliarUsuariosImportados(){
  if(!Array.isArray(state.users) || !state.users.length || !activeCompanyId) return { agregados: 0, enConflicto: [] };
  const idx = loadUserIndex();
  let agregados = 0;
  const enConflicto = [];
  state.users.forEach(u => {
    const existente = idx.find(x => x.username.toLowerCase() === u.username.toLowerCase());
    if(existente && existente.companyId !== activeCompanyId){
      enConflicto.push(u.username); // ese usuario ya pertenece a otra empresa en este navegador
      return;
    }
    if(existente){
      existente.passwordHash = u.passwordHash;
      existente.role = u.role;
    } else {
      idx.push({ username: u.username, companyId: activeCompanyId, passwordHash: u.passwordHash, role: u.role });
      agregados++;
    }
  });
  saveUserIndex(idx);
  return { agregados, enConflicto };
}

// Migra empresas creadas con el esquema anterior (usuario/contraseña guardados
// directamente en el directorio de empresas) hacia el nuevo esquema de usuarios con roles.
async function migrateOldCompanies(){
  let changed = false;
  for(const c of companies){
    if(c.username && c.passwordHash){
      let s;
      try{ s = JSON.parse(localStorage.getItem(companyDataKey(c.id)) || 'null'); } catch(e){ s = null; }
      if(s && (!Array.isArray(s.users) || !s.users.length)){
        s.users = [{ id: uid(), username: c.username, passwordHash: c.passwordHash, role: 'administrador' }];
        try{ localStorage.setItem(companyDataKey(c.id), JSON.stringify(s)); } catch(e){ /* noop */ }
        addUserToIndex(c.username, c.id, c.passwordHash, 'administrador');
      }
      delete c.username;
      delete c.passwordHash;
      changed = true;
    }
  }
  if(changed) saveCompaniesDirectory();
}

const MAJOR_CLASS_LABELS = { 1:'ACTIVO', 2:'PASIVO', 3:'PATRIMONIO', 4:'INGRESOS', 5:'GASTOS', 6:'COSTOS DE VENTAS' };

function getAccount(code){

}
function getAccountDesc(code){

function getAccountType(code){

}
function getTercero(nit){

}
function getTerceroNombre(nit){

}
function getSubclassCode(code){
  const s = String(code);
  return s.length >= 2 ? s.slice(0,2) : s;
}
function getSubclassLabel(code){
  const sub = getSubclassCode(code);
  const found = getAccount(sub);
  return found ? found.desc : sub;
}

function accountBalancesMap(){
  const map = {};
  state.asientos.forEach(a => {
    if(!map[a.cuenta]) map[a.cuenta] = { debito: 0, credito: 0 };
    map[a.cuenta].debito += Number(a.debito) || 0;
    map[a.cuenta].credito += Number(a.credito) || 0;
  });
  return map;
}

function accountsWithMovement(types){
  const map = accountBalancesMap();
  let list = Object.keys(map).map(code => {
    const acc = getAccount(code);
    const debito = map[code].debito;
    const credito = map[code].credito;
    return { code, desc: acc ? acc.desc : code, type: acc ? acc.type : null, debito, credito, saldo: debito - credito };
  });
  if(types) list = list.filter(x => types.includes(x.type));
  list.sort((a,b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
  return list;
}

function globalTotals(){
  let debito = 0, credito = 0;
  state.asientos.forEach(a => { debito += Number(a.debito) || 0; credito += Number(a.credito) || 0; });
  return { debito, credito, diferencia: debito - credito };
}

function computeER(filters){
  const accounts = accountsFromAsientos(filteredAsientos(filters), [4,5,6]);
  const sumSide = (arr, creditSide) => arr.reduce((s,a) => s + (creditSide ? (a.credito - a.debito) : (a.debito - a.credito)), 0);

  const ingresos = accounts.filter(a => a.type === 4);
  const ingresosOperacionales = ingresos.filter(a => a.code.startsWith('41'));
  const ingresosNoOperacionales = ingresos.filter(a => a.code.startsWith('42'));
  const totalIngresos = sumSide(ingresos, true);

  const costos = accounts.filter(a => a.type === 6);
  const totalCostos = sumSide(costos, false);
  const utilidadBruta = totalIngresos - totalCostos;

  const gastos = accounts.filter(a => a.type === 5);
  const gastosAdmon = gastos.filter(a => a.code.startsWith('51'));
  const gastosVentas = gastos.filter(a => a.code.startsWith('52'));
  const gastosNoOperacionales = gastos.filter(a => a.code.startsWith('53'));
  const impuestoRenta = gastos.filter(a => a.code.startsWith('54'));

  const totalGastosOperacionales = sumSide(gastosAdmon, false) + sumSide(gastosVentas, false);
  const utilidadOperacional = utilidadBruta - totalGastosOperacionales;
  const totalNoOperacionales = sumSide(gastosNoOperacionales, false);
  const utilidadAntesImpuesto = utilidadOperacional - totalNoOperacionales;
  const totalImpuestoRenta = sumSide(impuestoRenta, false);
  const utilidadNeta = utilidadAntesImpuesto - totalImpuestoRenta;

  return {
    ingresosOperacionales, ingresosNoOperacionales, totalIngresos,
    costos, totalCostos, utilidadBruta,
    gastosAdmon, gastosVentas, totalGastosOperacionales, utilidadOperacional,
    gastosNoOperacionales, totalNoOperacionales, utilidadAntesImpuesto,
    impuestoRenta, totalImpuestoRenta, utilidadNeta,
  };
}

function computeESF(filters){
  const accounts = accountsFromAsientos(filteredAsientos(filters), [1,2,3]);
  const activo = accounts.filter(a => a.type === 1);
  const pasivo = accounts.filter(a => a.type === 2);
  const patrimonio = accounts.filter(a => a.type === 3);

  const totalActivo = activo.reduce((s,a) => s + (a.debito - a.credito), 0);
  const totalPasivo = pasivo.reduce((s,a) => s + (a.credito - a.debito), 0);
  const totalPatrimonioBase = patrimonio.reduce((s,a) => s + (a.credito - a.debito), 0);

  const er = computeER(filters);
  const utilidadEjercicio = er.utilidadNeta;
  const totalPatrimonio = totalPatrimonioBase + utilidadEjercicio;
  const totalPasivoPatrimonio = totalPasivo + totalPatrimonio;
  const diferencia = totalActivo - totalPasivoPatrimonio;

  return {
    activo, pasivo, patrimonio,
    totalActivo, totalPasivo, totalPatrimonioBase, utilidadEjercicio, totalPatrimonio,
    totalPasivoPatrimonio, diferencia, cuadra: Math.abs(diferencia) < 1,
  };
}

function groupByClass(accounts){
  const groups = {};
  accounts.forEach(a => {
    const sub = getSubclassCode(a.code);
    if(!groups[sub]) groups[sub] = { code: sub, label: getSubclassLabel(a.code), items: [] };
    groups[sub].items.push(a);
  });
  return Object.values(groups).sort((a,b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
}

function recentAsientosTableHTML(){
  const rows = [...state.asientos]
    .sort((a,b) => (b.fecha || '').localeCompare(a.fecha || ''))
    .slice(0, 8);
  if(!rows.length) return '<p class="empty-note">Todavía no hay asientos registrados.</p>';
  return `
    <table class="ledger">
      <thead><tr>
        <th>Fecha</th><th>Doc.</th><th>Descripción</th><th>Cuenta</th><th>Tercero</th>
        <th class="num">Débito</th><th class="num">Crédito</th>
      </tr></thead>
      <tbody>
        ${rows.map(a => `
          <tr>
            <td>${fmtDate(a.fecha)}</td>
            <td class="code">${escapeAttr(a.prefijo)}-${escapeAttr(a.numero)}</td>
            <td>${escapeAttr(a.descripcion)}</td>
            <td class="code">${escapeAttr(a.cuenta)} — ${escapeAttr(getAccountDesc(a.cuenta))}</td>
            <td>${escapeAttr(getTerceroNombre(a.nit) || a.nit)}</td>
            <td class="num">${a.debito ? fmtMoney(a.debito) : ''}</td>
            <td class="num">${a.credito ? fmtMoney(a.credito) : ''}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function proximosVencimientosHTML(){
  const hoy = todayISO();
  const rows = [...(state.calendario || [])]
    .filter(v => v.fecha)
    .sort((a,b) => a.fecha.localeCompare(b.fecha))
    .filter(v => {
      const dias = Math.round((new Date(v.fecha) - new Date(hoy)) / 86400000);
      return dias <= 7; // vencidos + próximos 7 días
    })
    .slice(0, 8);
  if(!rows.length) return '<p class="empty-note">No tienes vencimientos próximos registrados. Agrégalos en "Calendario tributario".</p>';
  return `
    <table class="ledger">
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Estado</th><th>Correo</th></tr></thead>
      <tbody>
        ${rows.map(v => {
          const est = vencimientoEstado(v.fecha);
          return `<tr>
            <td>${fmtDate(v.fecha)}</td>
            <td>${escapeAttr(v.tipo)}</td>
            <td>${escapeAttr(v.descripcion)}</td>
            <td style="${est.cls==='bad' ? 'color:var(--bad); font-weight:600;' : est.cls==='ok' ? 'color:var(--good); font-weight:600;' : ''}">${est.label}</td><td><a class="btn btn-sm" href="mailto:${escapeAttr(state.empresa.correo||'')}?subject=${encodeURIComponent('Recordatorio tributario '+v.tipo)}&body=${encodeURIComponent(v.descripcion+'\nVence: '+fmtDate(v.fecha))}">✉️</a></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function renderDashCharts(esf, er){
  if(typeof Chart === 'undefined'){ return; }
  try{
    const c1 = document.getElementById('dashActivoChart').getContext('2d');
    if(dashActivoChart) dashActivoChart.destroy();
    dashActivoChart = new Chart(c1, {
      type: 'bar',
      data: {
        labels: ['Activo', 'Pasivo', 'Patrimonio'],
        datasets: [{
          data: [esf.totalActivo, esf.totalPasivo, esf.totalPatrimonio],
          backgroundColor: ['#2B4C6F', '#B23A2E', '#2F6845'],
          borderRadius: 3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          title: { display: true, text: 'Situación financiera', font: { family: "'Source Serif 4', serif", size: 13, weight: '600' }, color: '#1C2B39' }
        },
        scales: { y: { ticks: { callback: v => fmtMoney(v) } } }
      }
    });

    const c2 = document.getElementById('dashERChart').getContext('2d');
    if(dashERChart) dashERChart.destroy();
    dashERChart = new Chart(c2, {
      type: 'bar',
      data: {
        labels: ['Ingresos', 'Costos', 'Gastos', 'Utilidad neta'],
        datasets: [{
          data: [er.totalIngresos, er.totalCostos, er.totalGastosOperacionales + er.totalNoOperacionales + er.totalImpuestoRenta, er.utilidadNeta],
          backgroundColor: ['#2F6845', '#B23A2E', '#7A2E3D', '#2B4C6F'],
          borderRadius: 3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          title: { display: true, text: 'Estado de resultados', font: { family: "'Source Serif 4', serif", size: 13, weight: '600' }, color: '#1C2B39' }
        },
        scales: { y: { ticks: { callback: v => fmtMoney(v) } } }
      }
    });
  } catch(err){ console.error('Error en gráficas de inicio', err); }
}

    ev.target.value = '';
  });

function getEmailConfig(){
  if(!state.empresa.emailConfig || typeof state.empresa.emailConfig !== 'object') state.empresa.emailConfig = { ...EMPRESA_DEFAULTS.emailConfig };
  return state.empresa.emailConfig;
}

function emailConfigReady(){
  const c=getEmailConfig();
  return !!(c.habilitado && c.publicKey && c.serviceId && c.templateId && (c.remitenteCorreo || state.empresa.correo));
}

function loadEmailJs(){
  if(typeof window !== 'undefined' && window.emailjs) return Promise.resolve(true);
  if(window.__emailJsLoading) return window.__emailJsLoading;
  window.__emailJsLoading = new Promise((resolve) => {
    const finish = () => resolve(typeof window !== 'undefined' && !!window.emailjs);
    const existing = document.querySelector('script[data-emailjs-loader]');
    if(existing){ existing.addEventListener('load', finish, {once:true}); existing.addEventListener('error', finish, {once:true}); setTimeout(finish, 7000); return; }
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
    script.async=true;
    script.setAttribute('data-emailjs-loader','1');
    script.onload=finish;
    script.onerror=finish;
    document.head.appendChild(script);
    setTimeout(finish, 7000);
  });
  return window.__emailJsLoading;
}

async function initEmailJs(){
  const c=getEmailConfig();
  if(!c.publicKey) return {ok:false,reason:'Falta la Public Key de EmailJS.'};
  const loaded=await loadEmailJs();
  if(!loaded) return {ok:false,reason:'No se pudo cargar EmailJS. Verifica la conexión a Internet o que el navegador no esté bloqueando cdn.jsdelivr.net.'};
  try{
    emailjs.init({ publicKey:String(c.publicKey).trim(), limitRate:{ id:'libro-contable', throttle:1000 } });
    return {ok:true};
  }catch(err){
    console.error('EmailJS init:',err);
    return {ok:false,reason:(err && (err.text || err.message)) || 'Public Key no válida o no aceptada por EmailJS.'};
  }
}

function setEmailStatus(message, ok=false){

  el.innerHTML=`<div class="diff-banner ${ok?'ok':'bad'}">${message}</div>`;
}

function setupEmpresaEmail(){
  const section=document.getElementById('section-empresa');
  if(!section) return;
  section.querySelectorAll('[data-email]').forEach(input=>{
    const field=input.dataset.email;
    const handler=()=>{
      const c=getEmailConfig();
      // Los identificadores de EmailJS son sensibles al texto exacto que entrega el panel.
      // Se conserva mayúscula/minúscula y solo se eliminan espacios al inicio/final.
      c[field]=input.type==='checkbox' ? input.checked : String(input.value || '').trim();
      scheduleSave();
      if(field==='publicKey') { initEmailJs().then(r=>{ if(!r.ok) setEmailStatus('⚠️ '+escapeAttr(r.reason),false); }); }
    };
    input.addEventListener(input.type==='checkbox'?'change':'input',handler);
  });
  const test=document.getElementById('btnTestEmail');
  if(test) test.onclick=()=>openEmailComposer({ test:true });
  const composer=document.getElementById('btnOpenEmailComposer');
  if(composer) composer.onclick=()=>openEmailComposer({});
  const c=getEmailConfig();
  if(c.habilitado && c.publicKey) initEmailJs().then(r=>{ if(!r.ok) setEmailStatus('⚠️ '+escapeAttr(r.reason),false); });
  if(emailConfigReady()) setEmailStatus('✓ Configuración lista para enviar. Puedes usar «Enviar documento».',true);
  else setEmailStatus('Configuración pendiente. Completa Public Key, Service ID, Template ID y el correo remitente; luego activa los envíos.',false);
}

  `;
}

// Alternativa 100% gratuita: descarga el adjunto (si hay uno) y abre el programa de
// correo del usuario (Gmail, Outlook, Apple Mail, etc.) con destinatario, asunto y
// mensaje ya listos. El único paso manual es arrastrar el archivo ya descargado.
function abrirCorreoMailto(){
  const to = document.getElementById('emailTo').value.trim();
  const cc = document.getElementById('emailCc').value.trim();
  const bcc = document.getElementById('emailBcc').value.trim();
  const subject = document.getElementById('emailSubject').value.trim();

  if(!to){ alert('Escribe al menos un destinatario en "Para".'); return; }

    downloadBlob(composerAttachedFile.blob, composerAttachedFile.name);
  }
  const params = new URLSearchParams();
  if(cc) params.set('cc', cc);
  if(bcc) params.set('bcc', bcc);
  if(subject) params.set('subject', subject);
  const cuerpoCompleto = message + (composerAttachedFile ? `\n\n(Se descargó "${composerAttachedFile.name}" a tu equipo — adjúntalo aquí antes de enviar).` : '');

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(String(r.result||'')); r.onerror=reject; r.readAsDataURL(file); });
}

// Comprime un archivo/blob dentro de un .zip usando JSZip (carga la librería si hace falta).
async function zipFile(blob, filename){
  if(typeof JSZip === 'undefined'){
    throw new Error('JSZip no está disponible (revisa tu conexión a internet).');
  }
  const zip = new JSZip();
  zip.file(filename || 'archivo', blob);
  return await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } });
}

// Toma una "foto" (PNG) de un elemento del DOM, útil para adjuntar informes pesados como imagen liviana.
async function captureElementAsImage(elementId){
  if(typeof html2canvas === 'undefined'){
    throw new Error('html2canvas no está disponible (revisa tu conexión a internet).');
  }
  const el = document.getElementById(elementId);
  if(!el) throw new Error('No se encontró el contenido a capturar.');
  const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 1.5, useCORS: true });
  return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// Punto de entrada usado por los botones "Enviar por correo" de cada sección (informes, comprobantes, etc.)
async function enviarSeccionPorCorreo(elementId, tituloDocumento){
  if(typeof html2canvas === 'undefined'){
    alert('No se pudo cargar el módulo para capturar la imagen (html2canvas). Revisa tu conexión a internet.');
    return;
  }
  try{
    const blob = await captureElementAsImage(elementId);
    if(!blob){ alert('No se pudo generar la imagen del informe.'); return; }
    const nombreArchivo = tituloDocumento.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '.png';
    openEmailComposer({
      presetBlob: blob,
      presetName: nombreArchivo,
      presetType: 'image/png',
      presetSubject: `${tituloDocumento} — ${state.empresa.nombre || 'Empresa'}`,
      presetMessage: `Cordial saludo.\n\nAdjunto ${tituloDocumento.toLowerCase()} de ${state.empresa.nombre || 'la empresa'} generado el ${new Date().toLocaleString('es-CO')}.\n\nAtentamente,\n${state.empresa.nombre || ''}`,
    });
  } catch(err){
    console.error('Error generando la imagen del informe', err);
    alert('No se pudo generar la imagen del informe para enviarla por correo.');
  }
}

// Comparte la imagen del informe por WhatsApp. En el celular (con la app instalada
// desde un hosting https, no abriendo el archivo directamente) usa el selector nativo
// para compartir la imagen ya adjunta. Si el navegador no lo permite, descarga la
// imagen y abre WhatsApp con un texto listo para que la adjuntes manualmente.
async function enviarSeccionPorWhatsApp(elementId, tituloDocumento){
  if(typeof html2canvas === 'undefined'){
    alert('No se pudo cargar el módulo para generar la imagen (html2canvas). Revisa tu conexión a internet.');
    return;
  }
  try{
    const blob = await captureElementAsImage(elementId);
    if(!blob){ alert('No se pudo generar la imagen del informe.'); return; }
    const nombreArchivo = tituloDocumento.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '.png';
    const texto = `${tituloDocumento} — ${state.empresa.nombre || 'Empresa'} (generado el ${new Date().toLocaleString('es-CO')})`;

    if(navigator.canShare && typeof File !== 'undefined'){
      const file = new File([blob], nombreArchivo, { type: 'image/png' });
      if(navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: tituloDocumento, text: texto });
        return;
      }
    }
    // Reserva: descarga la imagen y abre WhatsApp con el texto listo (sin adjunto automático,
    // ya que un enlace de WhatsApp no puede llevar un archivo — solo texto).
    downloadBlob(blob, nombreArchivo);
    const waText = encodeURIComponent(texto + '\n\n(Se descargó la imagen del informe a tu equipo — adjúntala manualmente en este chat).');
    window.open(`https://wa.me/?text=${waText}`, '_blank');
  } catch(err){
    if(err && err.name === 'AbortError') return; // el usuario canceló el selector de compartir
    console.error('Error al compartir por WhatsApp', err);
    alert('No se pudo generar la imagen para compartir por WhatsApp.');
  }
}

async function sendEmailFromComposer(test=false){
  const c=getEmailConfig();
  const to=document.getElementById('emailTo').value.trim();
  const cc=document.getElementById('emailCc').value.trim();
  const bcc=document.getElementById('emailBcc').value.trim();
  const subject=document.getElementById('emailSubject').value.trim();
  const message=document.getElementById('emailMessage').value;
  const status=document.getElementById('emailComposerStatus');
  if(!to || !subject || (!test && !composerAttachedFile)){ status.innerHTML='<div class="diff-banner bad">Completa destinatario, asunto y archivo adjunto.</div>'; return; }
  const init=await initEmailJs();
  if(!init.ok){ status.innerHTML='<div class="diff-banner bad">No se pudo inicializar EmailJS: '+escapeAttr(init.reason)+'</div>'; return; }

  if(composerAttachedFile && composerAttachedFile.blob.size > 9*1024*1024){
    const esZip = /\.zip$/i.test(composerAttachedFile.name);
    if(!esZip && confirm('El archivo supera 9 MB. ¿Quieres comprimirlo a ZIP automáticamente e intentar de nuevo?')){
      try{
        const zipped = await zipFile(composerAttachedFile.blob, composerAttachedFile.name);
        setComposerAttachment(zipped, composerAttachedFile.name.replace(/\.[^.]+$/, '') + '.zip', 'application/zip');
      } catch(err){
        status.innerHTML='<div class="diff-banner bad">No se pudo comprimir el archivo.</div>';
        return;
      }
      if(composerAttachedFile.blob.size > 9*1024*1024){
        status.innerHTML='<div class="diff-banner bad">Aun comprimido, el archivo sigue superando 9 MB. Intenta adjuntarlo como imagen o divídelo en partes más pequeñas.</div>';
        return;
      }
    } else if(!esZip){
      status.innerHTML='<div class="diff-banner bad">El archivo supera 9 MB. Comprímelo a ZIP o usa uno más pequeño.</div>';
      return;
    } else {
      status.innerHTML='<div class="diff-banner bad">El archivo comprimido sigue superando 9 MB. Usa uno más pequeño.</div>';
      return;
    }
  }

  const btn=document.getElementById('emailSend'); btn.disabled=true; btn.textContent='Enviando…';
  try{
    const params={
      to_email:to,
      cc:cc,
      bcc:bcc,
      subject,
      message,
      from_name:c.remitenteNombre || state.empresa.nombre || 'Sistema contable',
      from_email:c.remitenteCorreo || state.empresa.correo || '',
      reply_to:c.replyTo || c.remitenteCorreo || state.empresa.correo || '',
      empresa:state.empresa.nombre || '',
      nit:state.empresa.nit || '',
    };
    if(composerAttachedFile){
      params.attachment = await fileToDataUrl(composerAttachedFile.blob);
      params.attachment_name = composerAttachedFile.name;
      params.attachment_type = composerAttachedFile.type || 'application/octet-stream';
    }
    const response=await emailjs.send(c.serviceId,c.templateId,params);
    if(response && response.status!==200) throw new Error(response.text||'Respuesta no válida del servicio.');
    const entry={id:uid(),fecha:new Date().toISOString(),para:to,asunto:subject,archivo:composerAttachedFile?composerAttachedFile.name:'',estado:'ENVIADO'};
    if(!Array.isArray(state.empresa.emailHistory)) state.empresa.emailHistory=[];
    state.empresa.emailHistory.unshift(entry); state.empresa.emailHistory=state.empresa.emailHistory.slice(0,100);
    scheduleSave();
    status.innerHTML='<div class="diff-banner ok">✓ Correo enviado correctamente.</div>';
    if(test) setEmailStatus('✓ Prueba enviada correctamente. La configuración funciona.',true);
    setTimeout(()=>{ const m=document.getElementById('emailComposerModal'); if(m)m.remove(); composerAttachedFile=null; },900);
  }catch(err){
    console.error('Error al enviar correo:',err);
    status.innerHTML='<div class="diff-banner bad">No se pudo enviar el correo: '+escapeAttr(err?.text || err?.message || 'Error desconocido')+'</div>';
  }finally{ btn.disabled=false; btn.textContent='Enviar'; }
}

function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#', ''), 16);
  let r = (num >> 16) + Math.round(2.55 * percent);
  let g = ((num >> 8) & 0x00FF) + Math.round(2.55 * percent);
  let b = (num & 0x0000FF) + Math.round(2.55 * percent);
  r = Math.max(Math.min(255, r), 0); g = Math.max(Math.min(255, g), 0); b = Math.max(Math.min(255, b), 0);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function updateNotifStatus(){
  const el = document.getElementById('notifStatus');
  if(!el) return;
  if(typeof Notification === 'undefined'){ el.textContent = 'Tu navegador no soporta notificaciones.'; return; }
  const map = { granted: '✓ Activadas', denied: '✗ Bloqueadas (actívalas en los permisos del sitio en tu navegador)', default: 'Todavía no activadas' };
  el.textContent = map[Notification.permission] || '';
}

async function solicitarPermisoNotificaciones(){
  if(typeof Notification === 'undefined'){ alert('Tu navegador no soporta notificaciones.'); return; }
  const perm = await Notification.requestPermission();
  updateNotifStatus();
  if(perm === 'granted'){
    new Notification('Libro Contable', { body: 'Listo — te avisaremos aquí cuando tengas vencimientos tributarios próximos.' });
    checkVencimientosNotificaciones();
  }
}

function checkVencimientosNotificaciones(){
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  if(!state || !Array.isArray(state.calendario)) return;
  const hoy = todayISO();
  const proximos = state.calendario.filter(v => {
    if(!v.fecha) return false;
    const dias = Math.round((new Date(v.fecha) - new Date(hoy)) / 86400000);
    return dias <= 7; // vencidos y próximos 7 días
  });
  if(!proximos.length) return;
  const key = 'libro-contable:lastNotifDate:' + activeCompanyId;
  if(localStorage.getItem(key) === hoy) return; // ya se avisó hoy, no repetir
  localStorage.setItem(key, hoy);
  const resumen = proximos.slice(0, 3).map(v => `${v.tipo}: ${v.descripcion || ''} (${fmtDate(v.fecha)})`).join('\n');
  new Notification(`${proximos.length} vencimiento${proximos.length===1?'':'s'} tributario${proximos.length===1?'':'s'} próximo${proximos.length===1?'':'s'}`, {
    body: resumen,
  });
}

/* ---------------------------------------------------------
   SINCRONIZACIÓN CON GOOGLE DRIVE
   Requiere que la app esté servida desde una URL real (https:// o localhost),
   NO abierta directamente como archivo (file://) — Google rechaza ese origen.
   El usuario debe crear su propio Client ID en Google Cloud Console.
--------------------------------------------------------- */
let driveAccessToken = null;
let driveTokenClient = null;

function driveConfig(){ return state.empresa.driveConfig; }

function driveOrigenValido(){
  return location.protocol === 'https:' || location.hostname === 'localhost';
}

function initGoogleTokenClient(){
  const c = driveConfig();
  if(!c.clientId){ return null; }
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){ return null; }
  if(driveTokenClient) return driveTokenClient;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: c.clientId.trim(),
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: () => {}, // se sobreescribe en cada solicitud, ver conectarGoogleDrive()
  });
  return driveTokenClient;
}

function conectarGoogleDrive(){
  return new Promise((resolve, reject) => {
    if(!driveOrigenValido()){
      reject(new Error('Google Drive solo funciona si esta app está alojada en una dirección web real (https://) — no abriendo el archivo directamente desde tu computador. Sube el archivo a un hosting como GitHub Pages o Netlify.'));
      return;
    }
    if(typeof google === 'undefined' || window.__googleGsiLoadFailed){
      reject(new Error('No se pudo cargar el módulo de Google (revisa tu conexión a internet).'));
      return;
    }
    const c = driveConfig();
    if(!c.clientId){
      reject(new Error('Primero escribe tu Client ID de Google en la configuración de Drive.'));
      return;
    }
    const client = initGoogleTokenClient();
    if(!client){ reject(new Error('No se pudo iniciar el cliente de Google.')); return; }
    driveTokenClient.callback = (resp) => {
      if(resp.error){ reject(new Error(resp.error)); return; }
      driveAccessToken = resp.access_token;
      resolve(driveAccessToken);
    };
    driveTokenClient.requestAccessToken({ prompt: driveAccessToken ? '' : 'consent' });
  });
}

async function driveFetch(url, options){
  options = options || {};
  options.headers = { ...(options.headers||{}), Authorization: 'Bearer ' + driveAccessToken };
  const res = await fetch(url, options);
  if(res.status === 401){ driveAccessToken = null; throw new Error('La sesión de Google expiró — conéctate de nuevo.'); }
  return res;
}

async function driveFindFileId(nombreArchivo){
  const q = encodeURIComponent(`name='${nombreArchivo.replace(/'/g, "\\'")}' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`);
  const data = await res.json();
  if(data.files && data.files.length) return data.files[0].id;
  return null;
}

// Lista TODOS los respaldos de esta app guardados en el Drive de la cuenta conectada,
// sin importar con qué nombre de empresa se hayan subido — así "Restaurar" no depende
// de adivinar el nombre exacto de archivo.
async function driveListarRespaldos(){
  if(!driveAccessToken) await conectarGoogleDrive();
  const q = encodeURIComponent(`name contains 'libro-contable-' and name contains '.json' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&spaces=drive`);
  if(!res.ok) throw new Error('No se pudo consultar tu Google Drive.');
  const data = await res.json();
  return data.files || [];
}

function nombreArchivoDrive(){
  const c = driveConfig();
  if(c.nombreArchivo) return c.nombreArchivo;
  const slug = (state.empresa.nombre || 'empresa').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  return `libro-contable-${slug}.json`;
}

async function driveSubirRespaldo(){
  if(!driveAccessToken) await conectarGoogleDrive();
  const nombreArchivo = nombreArchivoDrive();
  const contenido = JSON.stringify(state, null, 2);
  const existingId = await driveFindFileId(nombreArchivo);
  const metadata = { name: nombreArchivo, mimeType: 'application/json' };
  const boundary = 'libro_contable_boundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${contenido}\r\n--${boundary}--`;
  const url = existingId
    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await driveFetch(url, {
    method: existingId ? 'PATCH' : 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body,
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Google Drive respondió con error: ' + t.slice(0, 200)); }
  state.empresa.driveConfig.nombreArchivo = nombreArchivo;
  state.empresa.driveConfig.ultimaSincronizacion = new Date().toISOString();
  scheduleSave();
  return true;
}

async function driveDescargarArchivoPorId(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  if(!res.ok) throw new Error('No se pudo descargar el respaldo desde Drive.');
  return await res.json();
}

async function driveRestaurarRespaldo(){
  if(!driveAccessToken) await conectarGoogleDrive();
  const archivos = await driveListarRespaldos();
  if(!archivos.length) throw new Error('No se encontró ningún respaldo de Libro Contable en tu Google Drive todavía. Primero debes "Guardar copia en Drive" desde el computador donde sí tienes tus datos reales.');
  if(archivos.length === 1){
    return await driveDescargarArchivoPorId(archivos[0].id);
  }
  const lista = archivos.map((a, i) => `${i + 1}. ${a.name} (última modificación: ${new Date(a.modifiedTime).toLocaleString('es-CO')})`).join('\n');
  const eleccion = prompt(`Encontré ${archivos.length} respaldos en tu Drive. Escribe el número del que quieres restaurar:\n\n${lista}`, '1');
  const idx = parseInt(eleccion, 10) - 1;
  if(isNaN(idx) || idx < 0 || idx >= archivos.length) throw new Error('No se eligió un respaldo válido.');
  return await driveDescargarArchivoPorId(archivos[idx].id);
}

function isPeriodoCerrado(fecha){
  if(!fecha) return false;
  const [y, m] = fecha.split('-').map(Number);
  return state.periodosCerrados.some(p => p.anio === y && p.mes === m);
}

function periodoLabel(anio, mes){
  return MESES_LABELS_CORTOS[mes-1] + ' ' + anio;
}
const MESES_LABELS_CORTOS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  el.innerHTML = `

      <h1>Cierre de períodos contables</h1>
      <p>Cierra un mes cuando ya lo declaraste — mientras esté cerrado, nadie podrá crear, editar ni eliminar asientos con fecha dentro de ese mes (ni siquiera el administrador, salvo que lo reabra primero).</p>

  const body = document.getElementById('cierresBody');

const CALENDARIO_TIPOS=['IVA','RETENCIÓN EN LA FUENTE','ICA','RENTA','SIMPLE','OTRO'];
const DIAN2026_NIT_DATES={
 retencion:{1:[10,10,13,12,10,9,12,9,13,8,11,13],2:[11,11,14,13,11,10,13,10,14,9,12,14],3:[12,12,15,14,12,11,14,11,15,10,13,15],4:[13,13,16,18,13,12,18,14,16,14,17,18],5:[16,16,20,19,16,16,19,15,19,15,18,19],6:[17,17,21,20,17,17,20,16,20,16,19,20],7:[18,18,22,21,18,21,21,17,21,17,20,21],8:[19,19,23,24,19,22,24,18,22,18,23,22],9:[20,20,24,25,20,23,25,21,24,21,24,25],0:[23,24,27,26,24,24,26,22,25,22,25,26]},

};
function dianDueDate2026(kind,digit,periodIndex){
 const m=kind==='retencion'?periodIndex+2:[3,5,7,9,11,13][periodIndex]; const yy=m>12?2027:2026; const mm=((m-1)%12)+1; const arr=DIAN2026_NIT_DATES[kind][digit]; const day=arr[periodIndex]; return `${yy}-${String(mm).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function nitUltimoDigito(){const n=String(state.empresa.nit||'').replace(/\D/g,'');return n?n.slice(-1):'';}
function diasHasta(fecha){return Math.ceil((new Date(fecha+'T23:59:59')-new Date(todayISO()+'T00:00:00'))/86400000);}
function obligacionesProximas(){return (state.calendario||[]).filter(v=>diasHasta(v.fecha)>=0&&diasHasta(v.fecha)<=7).sort((a,b)=>a.fecha.localeCompare(b.fecha));}
function construirObligacionesPorResponsabilidad(){
 const resp=(state.empresa.responsabilidadesList||[]).map(x=>(x.codigo+' '+x.descripcion).toUpperCase()).join(' '); const digit=nitUltimoDigito(); const out=[]; if(!digit)return out; const now=todayISO();
 const add=(fecha,tipo,descripcion)=>{if(fecha<now)return; if(!state.calendario.some(v=>v.fecha===fecha&&v.tipo===tipo&&v.descripcion===descripcion))out.push({id:uid(),fecha,tipo,descripcion});};
 if(/IVA|RESPONSABLE.*IVA|RESPONSABLE DEL IVA/.test(resp)){for(let i=0;i<6;i++){const f=dianDueDate2026('ivaBim',digit,i);if(f>=now){add(f,'IVA',`IVA BIMESTRAL — PERÍODO ${['ENERO-FEBRERO','MARZO-ABRIL','MAYO-JUNIO','JULIO-AGOSTO','SEPTIEMBRE-OCTUBRE','NOVIEMBRE-DICIEMBRE'][i]} — NIT ${digit}`);break;}}}
 if(/RETEN|AUTORRETEN|AGENTE DE RETENC/.test(resp)){for(let i=0;i<12;i++){const f=dianDueDate2026('retencion',digit,i);if(f>=now){add(f,'RETENCIÓN EN LA FUENTE',`RETENCIÓN EN LA FUENTE — PERÍODO ${String((i+1)).padStart(2,'0')}/2026 — NIT ${digit}`);break;}}}
 if(/ICA|INDUSTRIA Y COMERCIO/.test(resp)) add(todayISO(),'ICA',`ICA — CONFIGURAR VENCIMIENTO MUNICIPAL DE ${state.empresa.ciudad||'LA CIUDAD'} (NO LO FIJA LA DIAN)`);
 return out;
}

 <div class="card"><h3>Panel de próximos vencimientos (7 días)</h3><div id="calendarioAlerta7">${proximas.length?proximas.map(v=>`<div class="diff-banner bad"><strong>${fmtDate(v.fecha)}</strong> · ${escapeAttr(v.tipo)} · ${escapeAttr(v.descripcion)} <a href="mailto:${escapeAttr(state.empresa.correo||'')}?subject=${encodeURIComponent('Recordatorio tributario: '+v.tipo)}&body=${encodeURIComponent('Vencimiento: '+fmtDate(v.fecha)+'\n'+v.descripcion)}" style="margin-left:auto">✉️ Correo</a></div>`).join(''):'<p class="empty-note">No hay vencimientos dentro de los próximos 7 días.</p>'}</div></div>
 <div class="card"><div class="table-scroll"><table class="ledger"><thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Estado</th><th></th></tr></thead><tbody id="calendarioBody"></tbody></table></div></div>`;

const MESES_LABELS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let presupuestoCuenta = '';
let presupuestoAnio = new Date().getFullYear();

function getPresupuestoEntry(cuenta, anio){
  let entry = state.presupuesto.find(p => p.cuenta === cuenta && p.anio === anio);
  if(!entry){
    entry = { cuenta, anio, meses: new Array(12).fill(0) };
    state.presupuesto.push(entry);
  }
  return entry;
}

function realPorMes(cuenta, anio){
  const meses = new Array(12).fill(0);
  const acc = getAccount(cuenta);
  const type = acc ? acc.type : null;
  state.asientos.forEach(a => {
    if(a.cuenta !== cuenta || !a.fecha) return;
    const parts = a.fecha.split('-').map(Number);
    if(parts[0] !== anio) return;
    const val = type === 4
      ? ((Number(a.credito)||0) - (Number(a.debito)||0))
      : ((Number(a.debito)||0) - (Number(a.credito)||0));
    meses[parts[1]-1] += val;
  });
  return meses;
}

function renderPresTable(){
  const table = document.getElementById('presTable');
  if(!table || !presupuestoCuenta) return;
  const entry = getPresupuestoEntry(presupuestoCuenta, presupuestoAnio);
  const real = realPorMes(presupuestoCuenta, presupuestoAnio);
  const editable = canEdit('respaldo');
  let totalP = 0, totalR = 0;

  const rows = MESES_LABELS.map((label, i) => {
    const p = entry.meses[i] || 0;
    const r = real[i] || 0;
    totalP += p; totalR += r;
    const variacion = r - p;
    return `
      <tr data-mes="${i}">
        <td>${label}</td>
        <td class="num">${editable ? `<input type="number" class="num-input" data-field="presupuesto" value="${p || ''}">` : fmtMoney(p)}</td>
        <td class="num">${fmtMoney(r)}</td>
        <td class="num ${variacion < 0 ? '' : ''}" style="color:${variacion >= 0 ? 'var(--good)' : 'var(--bad)'};">${fmtMoney(variacion)}</td>
      </tr>
    `;
  }).join('');

  table.innerHTML = `
    <thead><tr><th>Mes</th><th class="num">Presupuesto</th><th class="num">Real</th><th class="num">Variación</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${fmtMoney(totalP)}</td><td class="num">${fmtMoney(totalR)}</td><td class="num" style="color:${(totalR-totalP)>=0?'var(--good)':'var(--bad)'};">${fmtMoney(totalR-totalP)}</td></tr></tfoot>
  `;

  if(!editable) return;
  table.querySelectorAll('[data-field="presupuesto"]').forEach(input => {
    input.addEventListener('input', (e) => {
      const mes = parseInt(e.target.closest('tr').dataset.mes, 10);
      entry.meses[mes] = parseFloat(e.target.value) || 0;
      scheduleSave();
      renderPresTable();
    });
  });
}

function renderPresupuestoResumen(){

 const cuentas=state.puc.filter(a=>[4,5,6].includes(a.type)&&(!desde||a.code.localeCompare(desde,undefined,{numeric:true})>=0)&&(!hasta||a.code.localeCompare(hasta,undefined,{numeric:true})<=0));
 let p=0,r=0; cuentas.forEach(a=>{const e=getPresupuestoEntry(a.code,presupuestoAnio);p+=e.meses.reduce((x,y)=>x+(Number(y)||0),0);r+=realPorMes(a.code,presupuestoAnio).reduce((x,y)=>x+(Number(y)||0),0);}); const v=r-p; const pct=p?((r/p)*100):0;
 const host=document.querySelector('#section-presupuesto .card'); const box=document.createElement('div'); box.className='diff-banner '+(v>=0?'ok':'bad'); box.innerHTML=`RESUMEN ${presupuestoAnio}: PRESUPUESTO ${fmtMoney(p)} · REAL ${fmtMoney(r)} · VARIACIÓN ${fmtMoney(v)} · EJECUCIÓN ${pct.toFixed(2)}%`; host.prepend(box);
}
